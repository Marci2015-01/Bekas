<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crazy Frogger</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    :root { --bg: #0d1b2a; --accent: #00ff88; --ui-bg: rgba(0,0,0,0.85); }
    body { 
        margin: 0; overflow: hidden; background: var(--bg); 
        font-family: 'Press Start 2P', cursive; color: white;
        user-select: none; -webkit-user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    
    #ui {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center; pointer-events: none;
    }
    .panel {
        background: var(--ui-bg); border: 4px solid #fff; padding: 20px;
        text-align: center; pointer-events: auto; max-width: 400px; width: 90%;
        box-shadow: 10px 10px 0 #000;
        display: none; /* JS kapcsolja be */
    }
    h1 { color: var(--accent); font-size: 24px; line-height: 1.5; margin-bottom: 20px; text-shadow: 4px 4px #000; }
    button {
        background: #333; color: #fff; border: 2px solid #fff; padding: 15px; width: 100%;
        font-family: inherit; font-size: 16px; cursor: pointer; margin-bottom: 10px;
        text-transform: uppercase;
    }
    button:hover { background: var(--accent); color: #000; }
    button:active { transform: translateY(4px); }
    
    #hud { position: absolute; top: 10px; left: 10px; z-index: 5; font-size: 12px; text-shadow: 2px 2px #000; }
    
    /* Irányító gombok mobilon */
    #controls {
        position: absolute; bottom: 20px; left: 0; width: 100%; height: 160px;
        display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr;
        gap: 10px; padding: 0 20px; box-sizing: border-box; pointer-events: none;
    }
    .btn-key {
        pointer-events: auto; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
        display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 8px;
    }
    .btn-key:active { background: var(--accent); color: black; }
</style>
</head>
<body>

<div id="hud">PÉNZ: $<span id="score">0</span></div>

<div id="ui">
    <div id="menu" class="panel" style="display:block;">
        <h1>CRAZY<br>FROGGER</h1>
        <p style="font-size:10px; color:#aaa; margin-bottom:20px;">DING DING DING...</p>
        <button onclick="Game.start()">INDÍTÁS</button>
    </div>
    
    <div id="gameover" class="panel">
        <h1 style="color:#ff4444">VÉGE</h1>
        <button onclick="Game.start()">ÚJRA</button>
        <button onclick="location.reload()">MENÜ</button>
    </div>
</div>

<div id="controls">
    <div class="btn-key" style="grid-column: 2" onpointerdown="Input.handle('up', event)">▲</div>
    <div class="btn-key" style="grid-column: 1; grid-row: 2" onpointerdown="Input.handle('left', event)">◀</div>
    <div class="btn-key" style="grid-column: 2; grid-row: 2" onpointerdown="Input.handle('down', event)">▼</div>
    <div class="btn-key" style="grid-column: 3; grid-row: 2" onpointerdown="Input.handle('right', event)">▶</div>
</div>

<canvas id="cvs"></canvas>

<script>
// --- AUDIO ENGINE (AXEL F - CRAZY FROG THEME) ---
const AudioSynth = {
    ctx: null,
    tempo: 140, // BPM (Gyors)
    noteLen: 0.15,
    timer: null,
    step: 0,
    
    // A Híres Dallam
    melody: [
        // Ring ding ding...
        'f4','r','ab4','f4','f4','bb4','f4','eb4',
        'f4','r','c5','f4','f4','db5','c5','ab4',
        'f4','c5','f5','f4','eb4','eb4','c4','g4','f4'
    ],
    
    init() {
        if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if(this.ctx.state === 'suspended') this.ctx.resume();
    },
    
    freq(note) {
        if(note === 'r') return 0;
        const notes = {'c':261.6,'db':277.2,'d':293.7,'eb':311.1,'e':329.6,'f':349.2,'g':392.0,'ab':415.3,'a':440.0,'bb':466.2,'b':493.9};
        const oct = parseInt(note.slice(-1));
        const key = note.slice(0, -1);
        let f = notes[key];
        if(oct === 5) f *= 2;
        if(oct === 3) f /= 2;
        return f;
    },
    
    playNote(f, type='square') {
        if(f <= 0 || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + this.noteLen);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + this.noteLen);
    },
    
    loop() {
        if(!this.ctx) return;
        const note = this.melody[this.step % this.melody.length];
        this.playNote(this.freq(note), 'sawtooth'); // Szúrós szintetizátor hang
        
        // Basszus (dob helyett mély hang)
        if(this.step % 2 === 0) this.playNote(55, 'square'); 
        
        this.step++;
        this.timer = setTimeout(() => this.loop(), (60000/this.tempo)/2); // 8th notes
    },
    
    start() {
        this.init();
        if(this.timer) return;
        this.step = 0;
        this.loop();
    },
    
    stop() {
        clearTimeout(this.timer);
        this.timer = null;
    }
};

// --- SPRITES (PIXEL ART) ---
// 1=Zöld, 2=SötétZöld, 3=Szem, 4=Kerék, 5=Piros, 6=Sárga, 7=Kék
const SPRITES = {
    frog: [
        [0,3,0,0,3,0],
        [2,1,1,1,1,2],
        [1,2,1,1,2,1],
        [1,1,1,1,1,1],
        [2,1,0,0,1,2]
    ],
    car: [
        [0,5,5,5,5,0],
        [4,5,7,7,5,4], // 7 = ablak
        [5,5,5,5,5,5],
        [4,5,6,6,5,4]
    ],
    trabant: [
        [0,7,7,7,7,0],
        [4,7,7,7,7,4],
        [7,7,7,7,7,7],
        [4,6,7,7,6,4] // 7 = törtfehér szín
    ]
};

// --- GAME LOGIC ---
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let W, H;
const GRID = 40;

const Game = {
    running: false,
    frog: { x:0, y:0, tx:0, ty:0, lane:0, dead:false },
    map: [],
    cars: [],
    cam: 0,
    score: 0,
    
    resize() {
        W = cvs.width = window.innerWidth;
        H = cvs.height = window.innerHeight;
    },
    
    start() {
        this.resize();
        document.getElementById('menu').style.display = 'none';
        document.getElementById('gameover').style.display = 'none';
        
        // Audio indítása (User interaction szükséges)
        AudioSynth.start();
        
        // Pálya generálás
        this.map = [];
        this.cars = [];
        for(let i=0; i<100; i++) {
            let type = 'road';
            if(i % 5 === 0) type = 'safe';
            if(i === 0) type = 'safe';
            
            this.map.push({
                type: type,
                y: -i * GRID,
                speed: type==='road' ? (Math.random()*3+2) * (Math.random()>0.5?1:-1) : 0
            });
            
            if(type === 'road') {
                let carCount = Math.floor(Math.random()*2)+1;
                for(let c=0; c<carCount; c++) {
                    this.cars.push({
                        x: Math.random() * W,
                        y: -i * GRID,
                        lane: i,
                        speed: this.map[i].speed,
                        type: Math.random()>0.5 ? 'trabant' : 'car'
                    });
                }
            }
        }
        
        this.frog = { x: W/2, y: 0, tx: W/2, ty: 0, lane: 0, dead: false };
        this.score = 0;
        this.running = true;
        this.cam = 200;
        
        loop();
    },
    
    update() {
        if(!this.running) return;
        
        // Béka mozgás
        this.frog.x += (this.frog.tx - this.frog.x) * 0.3;
        this.frog.y += (this.frog.ty - this.frog.y) * 0.3;
        
        // Kamera
        this.cam += (-this.frog.y + H/2 - this.cam) * 0.1;
        
        // Autók
        this.cars.forEach(c => {
            c.x += c.speed;
            if(c.speed > 0 && c.x > W) c.x = -50;
            if(c.speed < 0 && c.x < -50) c.x = W + 50;
            
            // Ütközés (AABB)
            if(this.frog.lane === c.lane && Math.abs(this.frog.x - c.x) < 30) {
                this.die();
            }
        });
        
        // Pontszám
        const s = Math.abs(this.frog.lane);
        if(s > this.score) {
            this.score = s;
            document.getElementById('score').innerText = this.score;
        }
    },
    
    draw() {
        // Háttér (Sötétkék)
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, W, H);
        
        ctx.save();
        ctx.translate(0, this.cam);
        
        // Pálya kirajzolása
        this.map.forEach((lane, i) => {
            if(-lane.y + this.cam < -100 || -lane.y + this.cam > H+100) return; // Optimizáció
            
            if(lane.type === 'road') {
                ctx.fillStyle = '#222';
                ctx.fillRect(0, lane.y, W, GRID);
                ctx.fillStyle = '#fff';
                for(let k=0; k<W; k+=80) ctx.fillRect(k, lane.y+18, 20, 4); // Sávok
            } else {
                ctx.fillStyle = '#448833'; // Fű
                ctx.fillRect(0, lane.y, W, GRID);
            }
        });
        
        // Autók rajzolása (Pixel art)
        this.cars.forEach(c => {
            const isRight = c.speed > 0;
            const sprite = c.type === 'trabant' ? SPRITES.trabant : SPRITES.car;
            drawPixelSprite(c.x, c.y + 5, sprite, isRight, c.type);
        });
        
        // Béka rajzolása
        if(!this.frog.dead) {
            drawPixelSprite(this.frog.x - 15, this.frog.y + 5, SPRITES.frog, false, 'frog');
        }
        
        ctx.restore();
    },
    
    move(dir) {
        if(this.frog.dead) return;
        if(dir === 'up') { this.frog.lane++; this.frog.ty -= GRID; }
        if(dir === 'down') { this.frog.lane--; this.frog.ty += GRID; }
        if(dir === 'left') { this.frog.tx -= GRID; }
        if(dir === 'right') { this.frog.tx += GRID; }
    },
    
    die() {
        this.frog.dead = true;
        this.running = false;
        AudioSynth.stop();
        document.getElementById('gameover').style.display = 'block';
    }
};

// --- PIXEL RAJZOLÓ SEGÉD ---
function drawPixelSprite(x, y, map, flip, type) {
    const size = 6; // Pixel méret
    const cols = map[0].length;
    const rows = map.length;
    
    const palette = {
        0: null,
        1: '#00ff00', 2: '#004400', 3: 'white', // Béka
        4: 'black', 5: 'red', 6: 'yellow', 7: '#eee' // Autó
    };
    
    if(type === 'trabant') palette[7] = '#aaccff'; // Halványkék Trabant

    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            const colorCode = map[r][c];
            if(colorCode !== 0) {
                ctx.fillStyle = palette[colorCode];
                let px = flip ? (cols - 1 - c) * size : c * size;
                ctx.fillRect(x + px, y + r * size, size, size);
            }
        }
    }
}

const Input = {
    handle(dir, e) {
        if(e) e.preventDefault();
        Game.move(dir);
    }
};

window.addEventListener('keydown', e => {
    if(e.key === 'ArrowUp') Game.move('up');
    if(e.key === 'ArrowDown') Game.move('down');
    if(e.key === 'ArrowLeft') Game.move('left');
    if(e.key === 'ArrowRight') Game.move('right');
});

window.addEventListener('resize', Game.resize);
Game.resize();

// Loop
function loop() {
    requestAnimationFrame(loop);
    Game.update();
    Game.draw();
}

// Alapállapot rajzolása (hogy ne legyen fekete a háttér indítás előtt)
ctx.fillStyle = '#0d1b2a';
ctx.fillRect(0,0,window.innerWidth, window.innerHeight);

</script>
</body>
</html>
