
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Real Frogger - Mobile Fix</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
    :root { --bg: #0f172a; --text: #f8fafc; --accent: #4ade80; --danger: #ef4444; --gold: #fbbf24; }
    html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        overflow: hidden; background: var(--bg);
        font-family: 'Inter', sans-serif;
        touch-action: none; user-select: none; -webkit-user-select: none;
        color: var(--text);
    }
    canvas { display: block; width: 100%; height: 100%; }

    /* UI LAYERS */
    #ui-layer {
        position: absolute; inset: 0;
        display: flex; justify-content: center; align-items: center;
        z-index: 100;
        pointer-events: none;
    }

    .panel {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 30px; width: 90%; max-width: 420px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        text-align: center;
        backdrop-filter: blur(20px);
        display: none;
        pointer-events: auto;
    }

    h1 { font-weight: 800; font-size: 28px; margin: 0 0 10px 0; color: white; letter-spacing: -1px; }
    p { font-weight: 400; opacity: 0.7; font-size: 14px; margin-bottom: 25px; line-height: 1.5; color: #94a3b8; }

    input {
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        color: white; padding: 15px; width: 100%; border-radius: 8px;
        font-family: inherit; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; text-align: center;
        outline: none; transition: 0.3s;
    }
    
    button {
        background: white; color: #0f172a; border: none; padding: 16px; width: 100%;
        border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 16px;
        transition: 0.2s; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;
        touch-action: manipulation;
    }
    button:active { transform: scale(0.96); opacity: 0.8; }
    
    button.secondary { background: transparent; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.1); font-size: 14px; }

    /* SHOP GRID */
    .shop-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .shop-item {
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    }
    .shop-item.active { border: 2px solid var(--accent); background: rgba(74, 222, 128, 0.1); }
    .skin-preview { width: 30px; height: 30px; border-radius: 50%; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .skin-price { font-size: 11px; font-weight: 700; color: var(--gold); }
    .skin-owned { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 600; }

    /* HUD */
    #hud {
        position: absolute; top: 20px; left: 20px; right: 20px;
        display: flex; justify-content: space-between;
        pointer-events: none; opacity: 0; transition: opacity 1s; z-index: 50;
    }
    .hud-stat {
        background: rgba(15, 23, 42, 0.8); padding: 8px 16px; border-radius: 30px;
        font-size: 13px; font-weight: 600; color: white;
        backdrop-filter: blur(8px); display: flex; align-items: center; gap: 8px;
        border: 1px solid rgba(255,255,255,0.1);
    }

    /* MOBIL CONTROLS (Visible Buttons) */
    #controls {
        position: absolute; bottom: 20px; left: 20px; right: 20px; height: 160px;
        z-index: 90; display: none; /* JS enables */
        pointer-events: none;
    }
    
    /* D-PAD Layout */
    .d-pad {
        position: absolute; bottom: 0; width: 100%; height: 100%;
        display: grid; 
        grid-template-rows: 1fr 1fr;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        pointer-events: auto;
    }

    .d-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        display: flex; justify-content: center; align-items: center;
        color: rgba(255, 255, 255, 0.8);
        font-size: 24px; font-weight: 900;
        backdrop-filter: blur(4px);
        user-select: none;
        transition: background 0.1s;
    }
    .d-btn:active { background: rgba(74, 222, 128, 0.4); color: white; transform: scale(0.95); }

    /* Button positioning */
    #btn-left { grid-row: 2; grid-column: 1; border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
    #btn-down { grid-row: 2; grid-column: 2; }
    #btn-right { grid-row: 2; grid-column: 3; border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
    #btn-up { grid-row: 1; grid-column: 1 / 4; margin-bottom: 5px; background: rgba(255,255,255,0.15); }

</style>
</head>
<body>

<div id="hud">
    <div class="hud-stat"><span id="level-display">SZINT 1</span></div>
    <div class="hud-stat"><span style="color:var(--gold)">●</span><span id="coin-display">0</span></div>
</div>

<div id="ui-layer">
    <div id="profile-panel" class="panel">
        <h1>VÁLASSZ BÉKÁT</h1>
        <div id="profile-list-container" style="margin-bottom:20px; max-height:150px; overflow-y:auto; text-align:left;"></div>
        <button onclick="showRegister()" class="secondary">+ ÚJ PROFIL</button>
    </div>

    <div id="register-panel" class="panel">
        <h1>ÚJ KARRIER</h1>
        <p>Adj nevet a versenyzőnek.</p>
        <input type="text" id="frog-name-input" placeholder="Név..." maxlength="12">
        <button onclick="registerFrog()">LÉTREHOZÁS</button>
        <button class="secondary" onclick="showProfiles()">MÉGSE</button>
    </div>

    <div id="main-menu" class="panel">
        <h1 id="welcome-title">Üdv!</h1>
        <p>A forgalom ma sűrű. Készülj fel.</p>
        <button onclick="startGame()">JÁTÉK INDÍTÁSA</button>
        <button onclick="showShop()" style="background: var(--gold); color: black;">GARÁZS (SKINEK)</button>
        <button class="secondary" onclick="showProfiles()">KILÉPÉS</button>
    </div>

    <div id="shop-panel" class="panel">
        <h1 style="color:var(--gold)">PRÉMIUM BOLT</h1>
        <p>Egyenleged: <span id="shop-coins" style="color:white; font-weight:bold;">0</span></p>
        <div id="shop-grid" class="shop-grid"></div>
        <button class="secondary" onclick="showMenu()">VISSZA A MENÜBE</button>
    </div>

    <div id="end-panel" class="panel">
        <h1 id="end-title" style="font-size: 42px;">VÉGE</h1>
        <p id="end-desc">Vigyázz jobban!</p>
        <button id="end-action-btn" onclick="restartOrNext()">ÚJRA</button>
        <button class="secondary" onclick="showMenu()">MENÜ</button>
    </div>
</div>

<div id="controls">
    <div class="d-pad">
        <div class="d-btn" id="btn-up">▲ ELŐRE</div>
        <div class="d-btn" id="btn-left">◀</div>
        <div class="d-btn" id="btn-down">▼</div>
        <div class="d-btn" id="btn-right">▶</div>
    </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- AUDIO ---
const AudioEngine = {
    ctx: null, isPlaying: false, timer: null, index: 0,
    melody: [[523,100],[659,100],[523,100],[659,100],[784,90],[784,90],[880,90],[784,90],[0,50],[698,90],[698,90],[659,90],[587,90],[523,90],[392,90],[659,90],[523,90],[0,200]],
    init() { if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); },
    playTone(f,d,t='sine',v=0.05) { if(!this.ctx)return; const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.frequency.value=f; o.type=t; g.gain.setValueAtTime(v,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+d); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+d); },
    startMusic() { if(this.isPlaying) return; this.isPlaying=true; this.index=0; this.playNext(); },
    stopMusic() { this.isPlaying=false; clearTimeout(this.timer); },
    playNext() { if(!this.isPlaying)return; const n=this.melody[this.index]; if(n[0]>0)this.playTone(n[0],n[1]/1000,'square',0.03); this.index=(this.index+1)%this.melody.length; this.timer=setTimeout(()=>this.playNext(),n[1]); },
    fx(t) { if(!this.ctx)return; if(t==='jump')this.playTone(150,0.1,'triangle',0.1); if(t==='coin'){this.playTone(1200,0.1,'sine',0.1);setTimeout(()=>this.playTone(1800,0.2,'sine',0.1),50);} if(t==='die')this.playTone(100,0.4,'sawtooth',0.2); if(t==='win'){this.playTone(400,0.1);setTimeout(()=>this.playTone(600,0.1),100);setTimeout(()=>this.playTone(800,0.3),200);} else if(t==='buy'){this.playTone(600,0.1,'square',0.2);setTimeout(()=>this.playTone(1000,0.2,'square',0.2),100);} else if(t==='error'){this.playTone(150,0.3,'sawtooth',0.2);} }
};

// --- DATA & SKINS ---
const AVAILABLE_SKINS = [
    { id: 'classic', name: 'KLASSZIK', color: '#4ade80', price: 0 },
    { id: 'aqua',    name: 'TENGERÉSZ', color: '#38bdf8', price: 250 },
    { id: 'lava',    name: 'LÁVA',      color: '#ef4444', price: 500 },
    { id: 'toxic',   name: 'TOXIKUS',   color: '#a855f7', price: 1000 },
    { id: 'night',   name: 'NINDZSA',   color: '#334155', price: 2000 },
    { id: 'gold',    name: 'MILLIOMOS', color: '#fbbf24', price: 5000 }
];

let profiles = JSON.parse(localStorage.getItem('frog_profiles_pro')) || [];
let currentFrogIndex = -1;
function saveProfiles() { localStorage.setItem('frog_profiles_pro', JSON.stringify(profiles)); }

// --- STATE ---
let width, height, laneH = 80;
let gameState = 'menu'; 
let level = 1;
let map = [], entities = [], particles = [];
let frog = { x:0, y:0, tx:0, ty:0, lane:0, jumpP:0, rot:0, dead:false, color: '#4ade80' };
let camY = 0;

// Texture
const noiseCanvas = document.createElement('canvas'); noiseCanvas.width=200; noiseCanvas.height=200; const nCtx=noiseCanvas.getContext('2d');
for(let i=0;i<4000;i++){nCtx.fillStyle=`rgba(255,255,255,${Math.random()*0.1})`;nCtx.fillRect(Math.random()*200,Math.random()*200,2,2);}
const asphaltPattern = ctx.createPattern(noiseCanvas,'repeat');

// --- UI FUNCTIONS ---
function initApp() { resize(); showProfiles(); }

function showProfiles() {
    AudioEngine.stopMusic();
    document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
    document.getElementById('controls').style.display = 'none'; // Hide controls
    
    if (profiles.length === 0) { showRegister(); return; }
    
    document.getElementById('profile-panel').style.display = 'block';
    const list = document.getElementById('profile-list-container');
    list.innerHTML = '';
    profiles.forEach((p, index) => {
        if(!p.skin) p.skin = 'classic'; if(!p.ownedSkins) p.ownedSkins = ['classic'];
        const div = document.createElement('div');
        div.style.padding = "10px"; div.style.background="rgba(255,255,255,0.05)"; div.style.marginBottom="5px"; div.style.cursor="pointer"; div.style.borderRadius="4px";
        div.style.border = "1px solid rgba(255,255,255,0.1)";
        div.innerHTML = `<b>${p.name}</b> <span style="font-size:12px; float:right; color:#fbbf24">lvl ${p.lvl||1} • ${p.coins}$</span>`;
        div.onclick = () => { currentFrogIndex = index; level = p.lvl || 1; showMenu(); };
        list.appendChild(div);
    });
}

function showRegister() { document.getElementById('profile-panel').style.display = 'none'; document.getElementById('register-panel').style.display = 'block'; }
function registerFrog() {
    const name = document.getElementById('frog-name-input').value.trim();
    if(name.length < 2) return;
    profiles.push({ name: name, coins: 0, lvl: 1, skin: 'classic', ownedSkins: ['classic'] });
    saveProfiles(); currentFrogIndex = profiles.length - 1; level = 1; showMenu();
}

function showMenu() {
    gameState = 'menu'; document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
    document.getElementById('main-menu').style.display = 'block';
    document.getElementById('hud').style.opacity = 0;
    document.getElementById('controls').style.display = 'none';
    const p = profiles[currentFrogIndex];
    document.getElementById('welcome-title').innerText = `SZIA, ${p.name.toUpperCase()}!`;
}

function showShop() { document.getElementById('main-menu').style.display = 'none'; document.getElementById('shop-panel').style.display = 'block'; renderShop(); }
function renderShop() {
    const p = profiles[currentFrogIndex]; document.getElementById('shop-coins').innerText = p.coins;
    const grid = document.getElementById('shop-grid'); grid.innerHTML = '';
    AVAILABLE_SKINS.forEach(skin => {
        const owned = p.ownedSkins.includes(skin.id); const selected = p.skin === skin.id;
        const card = document.createElement('div'); card.className = `shop-item ${selected ? 'active' : ''}`;
        let label = selected ? '<span class="skin-owned" style="color:var(--accent)">KIVÁLASZTVA</span>' : (owned ? '<span class="skin-owned">MEGVÉVE</span>' : `<span class="skin-price">${skin.price} $</span>`);
        card.innerHTML = `<div class="skin-preview" style="background:${skin.color}"></div><div style="font-weight:700; font-size:10px; margin-bottom:5px;">${skin.name}</div>${label}`;
        card.onclick = () => buyOrSelectSkin(skin); grid.appendChild(card);
    });
}

function buyOrSelectSkin(skin) {
    const p = profiles[currentFrogIndex]; const owned = p.ownedSkins.includes(skin.id);
    if (owned) { p.skin = skin.id; saveProfiles(); renderShop(); }
    else {
        if (p.coins >= skin.price) {
            if(confirm(`Megveszed a ${skin.name} skint ${skin.price} érméért?`)) {
                p.coins -= skin.price; p.ownedSkins.push(skin.id); p.skin = skin.id; saveProfiles(); AudioEngine.fx('buy'); renderShop();
            }
        } else { AudioEngine.fx('error'); alert("Nincs elég pénzed!"); }
    }
}

function startGame() {
    AudioEngine.init(); AudioEngine.startMusic();
    document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
    document.getElementById('hud').style.opacity = 1;
    document.getElementById('controls').style.display = 'block'; // SHOW CONTROLS
    updateHud(); gameState = 'playing'; generateLevel(); loop();
}

function updateHud() { if(currentFrogIndex === -1) return; document.getElementById('level-display').innerText = `SZINT ${level}`; document.getElementById('coin-display').innerText = profiles[currentFrogIndex].coins; }
function restartOrNext() { if(gameState === 'win') { level++; profiles[currentFrogIndex].lvl = level; saveProfiles(); } startGame(); }
function showEndScreen(won) {
    document.getElementById('end-panel').style.display = 'block';
    document.getElementById('controls').style.display = 'none'; // Hide controls on end
    const title = document.getElementById('end-title'); const desc = document.getElementById('end-desc'); const btn = document.getElementById('end-action-btn');
    if(won) { title.innerText = "SZÉP VOLT!"; title.style.color = "#4ade80"; desc.innerText = "Sikeresen átjutottál."; btn.innerText = "KÖVETKEZŐ SZINT"; gameState = 'win'; }
    else { title.innerText = "VÉGE"; title.style.color = "#ef4444"; desc.innerText = "Sajnos elütöttek."; btn.innerText = "ÚJRA"; gameState = 'dead'; }
}

// --- GAMEPLAY ---
function generateLevel() {
    map = []; entities = []; particles = [];
    const p = profiles[currentFrogIndex]; const skinObj = AVAILABLE_SKINS.find(s => s.id === p.skin); const frogColor = skinObj ? skinObj.color : '#4ade80';
    map.push({type:'goal'}); map.push({type:'grass'});
    let length = 15 + Math.min(level, 10);
    for(let i=0; i<length; i++) {
        const r = Math.random(); let type = 'road'; if(r < 0.3) type = 'water'; else if(r < 0.5) type = 'grass';
        if(type==='water'&&map[map.length-1].type==='water'&&map[map.length-2].type==='water') type='road';
        let speed = (Math.random() + 0.5 + (level * 0.1)); map.push({type: type, speed: speed * (Math.random()>0.5?1:-1)});
    }
    map.push({type:'grass'}, {type:'grass'}, {type:'grass'});
    map.forEach((lane, i) => {
        if(i < 2 || i >= map.length - 3) return;
        if(lane.type === 'road') {
            let cnt = Math.floor(Math.random() * 2) + 1;
            for(let j=0; j<cnt; j++) {
                let subtype = Math.random() < 0.25 ? 'trabant' : 'normal';
                let w = subtype === 'trabant' ? 100 : 120;
                let c = subtype === 'trabant' ? ['#dbe7e4', '#e6e6bd', '#a8c0b0'][Math.floor(Math.random()*3)] : ['#3b82f6', '#ef4444', '#8b5cf6'][Math.floor(Math.random()*3)];
                entities.push({ type: 'car', subtype: subtype, lane: i, x: j*(width/cnt) + Math.random()*100, w: w, h: 50, speed: lane.speed * (subtype==='trabant'?0.8:1), color: c });
            }
        } else if (lane.type === 'water') {
            let cnt = Math.floor(Math.random() * 2) + 2; for(let j=0; j<cnt; j++) entities.push({type: 'log', lane: i, x: j*(width/cnt) + Math.random()*50, w: 160, h: 45, speed: lane.speed});
        } else if (lane.type === 'grass') {
            if(Math.random()>0.6) entities.push({type: 'tree', lane: i, x: Math.random()*width, w:60, h:60});
            if(Math.random()>0.8) entities.push({type: 'coin', lane: i, x: Math.random()*width, w:20, h:20, active:true});
        }
    });
    let startLane = map.length - 2;
    frog = { x: width/2, y: startLane * laneH + laneH/2, tx: width/2, ty: startLane * laneH + laneH/2, lane: startLane, jumpP: 0, rot: 0, dead: false, color: frogColor };
    camY = frog.y - height/2;
}

function handleInput(dir) {
    if(gameState !== 'playing' || frog.dead) return;
    if(frog.jumpP > 0.05) return; 
    let nextLane = frog.lane; let nextX = frog.tx;
    if(dir==='up') nextLane--; if(dir==='down') nextLane++; if(dir==='left') nextX-=60; if(dir==='right') nextX+=60;
    if(nextX < 20) return; if(nextX > width - 20) return; if(nextLane >= map.length) return;
    let blocked = false; entities.forEach(e => { if(e.type==='tree'&&e.lane===nextLane&&Math.abs(e.x-nextX)<40) blocked=true; });
    if(!blocked) {
        AudioEngine.fx('jump'); frog.lane = nextLane; frog.tx = nextX; frog.ty = frog.lane * laneH + laneH/2; frog.jumpP = 1;
        if(dir==='up')frog.rot=0; if(dir==='down')frog.rot=Math.PI; if(dir==='left')frog.rot=-Math.PI/2; if(dir==='right')frog.rot=Math.PI/2;
        if(frog.lane === 0) winLevel();
    }
}

function update() {
    if(gameState !== 'playing') return;
    frog.x += (frog.tx - frog.x) * 0.2; frog.y += (frog.ty - frog.y) * 0.2; frog.jumpP *= 0.85; 
    let targetCamY = frog.y - height * 0.6; camY += (targetCamY - camY) * 0.05;
    let onLog = false;
    entities.forEach(e => {
        if(e.speed) { e.x += e.speed; if(e.speed>0 && e.x>width+e.w)e.x=-e.w; if(e.speed<0 && e.x<-e.w)e.x=width+e.w; }
        if(e.subtype === 'trabant' && Math.random() > 0.8) particles.push({x: e.x + (e.speed>0?-e.w/2:e.w/2), y: e.lane*laneH + laneH/2 + 10, vx:0, vy:-1, life:0.5, color:'rgba(200,200,200,0.5)'});
        if(e.lane === frog.lane) {
            let overlap = Math.abs(frog.x - e.x) < (e.w/2 + 10);
            if(e.type==='car'&&overlap&&frog.jumpP<0.5) die();
            if(e.type==='log'&&overlap) { onLog=true; frog.tx+=e.speed; frog.x+=e.speed; }
            if(e.type==='coin'&&e.active&&Math.abs(frog.x-e.x)<30) { e.active=false; AudioEngine.fx('coin'); profiles[currentFrogIndex].coins++; saveProfiles(); updateHud(); }
        }
    });
    if(map[frog.lane] && map[frog.lane].type==='water' && !onLog && frog.jumpP<0.2) die();
    if(onLog && (frog.x < 0 || frog.x > width)) die();
    particles.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.05;if(p.life<=0)particles.splice(i,1);});
}

function die() { frog.dead = true; AudioEngine.fx('die'); AudioEngine.stopMusic(); showEndScreen(false); }
function winLevel() { AudioEngine.fx('win'); profiles[currentFrogIndex].coins += 50; saveProfiles(); updateHud(); showEndScreen(true); }

function draw() {
    ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, width, height); ctx.save(); ctx.translate(0, -camY);
    map.forEach((lane, i) => {
        let y = i * laneH; if(y < camY - laneH || y > camY + height) return;
        if(lane.type==='goal') { ctx.fillStyle = '#cbd5e1'; ctx.fillRect(0, y, width, laneH); ctx.fillStyle = '#1e293b'; for(let r=0; r<4; r++) for(let c=0; c<width/20; c++) if((r+c)%2===0) ctx.fillRect(c*20, y + r*20, 20, 20); ctx.fillStyle = 'rgba(74, 222, 128, 0.3)'; ctx.fillRect(0,y,width,laneH); }
        else if(lane.type==='grass'){let g=ctx.createLinearGradient(0,y,0,y+laneH);g.addColorStop(0,'#14532d');g.addColorStop(1,'#064e3b');ctx.fillStyle=g;ctx.fillRect(0,y,width,laneH);ctx.fillStyle=asphaltPattern;ctx.globalAlpha=0.1;ctx.fillRect(0,y,width,laneH);ctx.globalAlpha=1;}
        else if(lane.type==='road'){ctx.fillStyle='#1e293b';ctx.fillRect(0,y,width,laneH);ctx.fillStyle=asphaltPattern;ctx.globalAlpha=0.15;ctx.fillRect(0,y,width,laneH);ctx.globalAlpha=1;ctx.fillStyle='rgba(255,255,255,0.2)';for(let k=0;k<width;k+=80)ctx.fillRect(k,y+laneH/2,40,2);ctx.fillStyle='#0f172a';ctx.fillRect(0,y,width,4);ctx.fillRect(0,y+laneH-4,width,4);}
        else if(lane.type==='water'){let g=ctx.createLinearGradient(0,y,0,y+laneH);g.addColorStop(0,'#0c4a6e');g.addColorStop(1,'#075985');ctx.fillStyle=g;ctx.fillRect(0,y,width,laneH);ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(0,y+10,width,5);ctx.fillRect(0,y+30,width,2);}
    });
    entities.forEach(e => {
        if(e.y < camY - 100 || e.y > camY + height) return;
        let y = e.lane * laneH + laneH/2;
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath();
        if(e.type==='car') ctx.roundRect(e.x-e.w/2+10,y-e.h/2+10,e.w,e.h,10); else if(e.type==='tree') ctx.arc(e.x+5,y+5,25,0,Math.PI*2); else if(e.type==='log') ctx.roundRect(e.x-e.w/2+5,y-e.h/2+10,e.w,e.h,5);
        ctx.fill();
    });
    entities.forEach(e => {
        if(e.y < camY - 100 || e.y > camY + height) return;
        let y = e.lane * laneH + laneH/2;
        if(e.type==='log'){let g=ctx.createLinearGradient(e.x-e.w/2,y-e.h/2,e.x-e.w/2,y+e.h/2);g.addColorStop(0,'#451a03');g.addColorStop(1,'#78350f');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(e.x-e.w/2,y-e.h/2,e.w,e.h,6);ctx.fill();}
        else if(e.type==='car'){
            const isRight=e.speed>0; ctx.save(); ctx.translate(e.x,y); if(!isRight)ctx.scale(-1,1);
            if(e.subtype === 'trabant') { ctx.fillStyle = e.color; ctx.beginPath(); ctx.roundRect(-e.w/2, -e.h/2, e.w, e.h, 4); ctx.fill(); ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(-e.w/4, -e.h/2+2, e.w/2, e.h-4); ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(e.w/2, -12, 6, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(e.w/2, 12, 6, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#ef4444'; ctx.fillRect(-e.w/2, -15, 3, 30); } else { let b=ctx.createLinearGradient(e.w/2,0,e.w/2+150,0);b.addColorStop(0,'rgba(255,255,200,0.4)');b.addColorStop(1,'transparent');ctx.fillStyle=b;ctx.beginPath();ctx.moveTo(e.w/2,-15);ctx.lineTo(e.w/2+150,-40);ctx.lineTo(e.w/2+150,40);ctx.lineTo(e.w/2,15);ctx.fill(); ctx.fillStyle=e.color;ctx.beginPath();ctx.roundRect(-e.w/2,-e.h/2,e.w,e.h,8);ctx.fill(); ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.roundRect(-e.w/4,-e.h/2+5,e.w/2,e.h-10,4);ctx.fill(); ctx.fillStyle='#fbbf24';ctx.fillRect(e.w/2-2,-15,2,6);ctx.fillRect(e.w/2-2,10,2,6); }
            ctx.restore();
        } else if(e.type==='tree'){ctx.fillStyle='#14532d';ctx.beginPath();for(let i=0;i<7;i++){let a=(i/7)*Math.PI*2,r=25+Math.random()*5;ctx.lineTo(e.x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.fill();ctx.fillStyle='#15803d';ctx.beginPath();ctx.arc(e.x,y,15,0,Math.PI*2);ctx.fill();}
        else if(e.type==='coin'&&e.active){ctx.fillStyle='#fbbf24';ctx.shadowColor='#f59e0b';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(e.x,y,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
    });
    particles.forEach(p=>{ctx.fillStyle=p.color;ctx.globalAlpha=p.life;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.28);ctx.fill();ctx.globalAlpha=1;});
    if(!frog.dead){ctx.save();ctx.translate(frog.x,frog.y);ctx.rotate(frog.rot);let s=1+frog.jumpP*0.3;ctx.scale(s,s);ctx.fillStyle=frog.color;ctx.beginPath();ctx.ellipse(-12,-12,6,12,-0.5,0,6.28);ctx.ellipse(12,-12,6,12,0.5,0,6.28);ctx.ellipse(-12,12,6,12,0.5,0,6.28);ctx.ellipse(12,12,6,12,-0.5,0,6.28);ctx.fill();ctx.filter = 'brightness(1.1)';ctx.beginPath();ctx.ellipse(0,0,14,18,0,0,6.28);ctx.fill();ctx.filter = 'none';ctx.fillStyle='#022c22';ctx.beginPath();ctx.arc(-6,-8,2,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(6,-8,2,0,6.28);ctx.fill();ctx.restore();}
    ctx.restore();
}

function loop() { if(gameState==='playing') { update(); draw(); requestAnimationFrame(loop); } else { draw(); } }

// KEYBOARD + MOBILE TOUCH HANDLERS (Fixed)
function attachTouch(id, dir) {
    const el = document.getElementById(id);
    if(el) {
        el.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(dir); }, {passive: false});
        el.addEventListener('mousedown', (e) => { e.preventDefault(); handleInput(dir); });
    }
}
attachTouch('btn-up', 'up'); attachTouch('btn-down', 'down'); attachTouch('btn-left', 'left'); attachTouch('btn-right', 'right');

window.addEventListener('keydown', e => { 
    if(gameState==='playing') {
        if(e.key==='ArrowUp'||e.key==='w')handleInput('up'); if(e.key==='ArrowDown'||e.key==='s')handleInput('down'); if(e.key==='ArrowLeft'||e.key==='a')handleInput('left'); if(e.key==='ArrowRight'||e.key==='d')handleInput('right'); 
    }
});
function resize() { width=canvas.width=window.innerWidth; height=canvas.height=window.innerHeight; }
window.addEventListener('resize', resize);
initApp();
</script>
