<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Szuper Állatos Útkelő - Hibrid</title>
<style>
    html, body {
        margin: 0; padding: 0; 
        height: 100%; width: 100%;
        overflow: hidden; 
        background-color: #222;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        user-select: none; /* Szövegkijelölés tiltása */
    }
    canvas {
        display: block;
        background-color: #333;
        cursor: crosshair;
    }
    
    /* UI RÉTEG */
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        display: flex; justify-content: center; align-items: center;
        z-index: 10;
    }
    #msg-box {
        background: rgba(0,0,0,0.9);
        color: white;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        display: none;
        pointer-events: auto;
        border: 4px solid white;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    h1 { margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 2px; }
    p { font-size: 18px; margin: 5px 0; }
    
    button.start-btn {
        background: #27ae60; color: white; border: none; padding: 15px 30px; 
        font-size: 20px; border-radius: 8px; cursor: pointer; margin-top: 20px;
        font-weight: bold; transition: background 0.2s;
    }
    button.start-btn:hover { background: #2ecc71; }

    /* --- VEZÉRLŐ GOMBOK (MOBILRA ÉS EGÉRHEZ) --- */
    #controls {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 180px;
        height: 120px;
        z-index: 20;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 8px;
        pointer-events: none; /* Hogy átlátszó legyen a kattintásnak, a gombok majd aktívak lesznek */
    }

    .ctrl-btn {
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 12px;
        color: white;
        font-size: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        pointer-events: auto; /* A gomb maga kattintható */
        transition: background 0.1s, transform 0.1s;
    }
    .ctrl-btn:active, .ctrl-btn.active-key {
        background: rgba(255, 255, 255, 0.6);
        transform: scale(0.95);
    }

    /* Elrendezés */
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    /* Info panel bal felül */
    #info {
        position: absolute; top: 10px; left: 10px; color: white;
        font-size: 16px; font-weight: bold; text-shadow: 1px 1px 2px black;
        z-index: 5;
    }

    /* Laptopon kicsit elrejtjük a gombokat, ha nem kellenek, de ott hagyjuk őket */
    @media (min-width: 1024px) {
        #controls { opacity: 0.3; }
        #controls:hover { opacity: 1; }
    }
</style>
</head>
<body>

<div id="info">Szint: <span id="level-disp">1</span></div>

<div id="ui-layer">
    <div id="msg-box">
        <h1 id="msg-title">Szuper Útkelő</h1>
        <p id="msg-sub">Juss át a túloldalra!</p>
        <p style="font-size: 14px; color: #aaa;">Irányítás: Nyilak / WASD / Gombok</p>
        <button class="start-btn" onclick="startGame()">START (Enter)</button>
    </div>
</div>

<div id="controls">
    <div class="ctrl-btn" id="btn-up">▲</div>
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-down">▼</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
</div>

<canvas id="game"></canvas>

<script>
// --- ALAP BEÁLLÍTÁSOK ---
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const msgBox = document.getElementById("msg-box");
const msgTitle = document.getElementById("msg-title");
const msgSub = document.getElementById("msg-sub");
const levelDisp = document.getElementById("level-disp");

let width, height, laneH;
let lanes = 10;
let level = 1;
let gameState = "menu"; // menu, playing, win, lose

// Játék objektumok
let frog = { x: 0, y: 0, lane: 0, size: 30 };
let cars = [];
let logs = [];
let train = { active: false, x: -1000, lane: 4, speed: 25, width: 800 };
let trainLight = "green";

// --- ÁTMÉRETEZÉS KEZELÉSE ---
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    laneH = height / lanes;
    
    // Ha játék közben méretezünk át, a békát a helyére rakjuk
    if(gameState === "playing") updateFrogPos();
    draw(); // Azonnal újrarajzolás
}
window.addEventListener('resize', resize);
resize();

// --- BÉKA POZÍCIÓ FRISSÍTÉS ---
function updateFrogPos() {
    frog.y = frog.lane * laneH + (laneH - frog.size)/2;
}

// --- JÁTÉK INDÍTÁSA ---
function startGame() {
    if(gameState === "playing") return;
    
    gameState = "playing";
    msgBox.style.display = "none";
    
    // Reset
    frog.lane = lanes - 1; // Alsó sáv
    frog.x = width / 2 - frog.size / 2;
    updateFrogPos();
    
    cars = [];
    logs = [];
    
    // Autók generálása
    for(let i=5; i<lanes-1; i++) {
        let count = 2 + Math.floor(Math.random() * 2);
        let speed = (3 + level * 0.5) * (i%2==0 ? 1 : -1);
        for(let j=0; j<count; j++) {
            cars.push({ x: Math.random()*width, lane: i, w: 60, h: 30, speed: speed });
        }
    }
    
    // Deszkák (Víz: 2-es, 3-as sáv)
    for(let i=2; i<=3; i++) {
        let count = 3;
        let speed = (2 + level * 0.3) * (i%2==0 ? 1 : -1);
        for(let j=0; j<count; j++) {
            logs.push({ x: Math.random()*width, lane: i, w: 100+Math.random()*60, h: 25, speed: speed });
        }
    }

    loop();
}

function stopGame(reason, win) {
    gameState = win ? "win" : "lose";
    msgTitle.textContent = win ? "SZINT TELJESÍTVE!" : "JÁTÉK VÉGE";
    msgTitle.style.color = win ? "#2ecc71" : "#e74c3c";
    msgSub.textContent = reason;
    msgBox.style.display = "block";
    
    if(win) {
        level++;
        levelDisp.textContent = level;
    }
}

// --- IRÁNYÍTÁS (Billentyűzet + Egér + Érintés) ---

function move(dir) {
    if(gameState !== "playing") return;
    
    if(dir === 'up') {
        frog.lane--;
        updateFrogPos();
    }
    else if(dir === 'down') {
        if(frog.lane < lanes - 1) {
            frog.lane++;
            updateFrogPos();
        }
    }
    else if(dir === 'left') frog.x -= 40;
    else if(dir === 'right') frog.x += 40;
}

// 1. BILLENTYŰZET
document.addEventListener("keydown", (e) => {
    // Enter kezelés
    if((e.key === "Enter" || e.code === "Space") && gameState !== "playing") {
        startGame();
        return;
    }

    // Mozgás
    if(gameState === "playing") {
        if(e.key === "ArrowUp" || e.key.toLowerCase() === "w") { move('up'); highlightBtn('btn-up'); }
        if(e.key === "ArrowDown" || e.key.toLowerCase() === "s") { move('down'); highlightBtn('btn-down'); }
        if(e.key === "ArrowLeft" || e.key.toLowerCase() === "a") { move('left'); highlightBtn('btn-left'); }
        if(e.key === "ArrowRight" || e.key.toLowerCase() === "d") { move('right'); highlightBtn('btn-right'); }
    }
});

// 2. GOMBOK (Egér + Érintés)
function setupBtn(id, dir) {
    const btn = document.getElementById(id);
    
    // Egér kattintás
    btn.addEventListener("mousedown", (e) => {
        e.preventDefault(); // Ne jelöljön ki szöveget
        move(dir);
    });
    
    // Érintés (hogy mobilon gyors legyen)
    btn.addEventListener("touchstart", (e) => {
        e.preventDefault(); 
        move(dir);
        btn.classList.add("active-key");
        setTimeout(() => btn.classList.remove("active-key"), 100);
    }, {passive: false});
}

setupBtn("btn-up", "up");
setupBtn("btn-down", "down");
setupBtn("btn-left", "left");
setupBtn("btn-right", "right");

// Vizuális visszajelzés billentyűzetnél
function highlightBtn(id) {
    const btn = document.getElementById(id);
    btn.classList.add("active-key");
    setTimeout(() => btn.classList.remove("active-key"), 100);
}

// --- JÁTÉK LOGIKA ---
function update() {
    if(gameState !== "playing") return;

    // Autók
    cars.forEach(c => {
        c.x += c.speed;
        if(c.speed > 0 && c.x > width) c.x = -c.w;
        if(c.speed < 0 && c.x < -c.w) c.x = width;
        // Ütközés
        if(frog.lane === c.lane && frog.x < c.x + c.w && frog.x + frog.size > c.x) {
            stopGame("Elütött az autó! 🚗", false);
        }
    });

    // Deszkák
    let onLog = false; let logSpeed = 0;
    logs.forEach(l => {
        l.x += l.speed;
        if(l.speed > 0 && l.x > width) l.x = -l.w;
        if(l.speed < 0 && l.x < -l.w) l.x = width;
        // Rajta vagyunk?
        if(frog.lane === l.lane && frog.x + frog.size/2 > l.x && frog.x + frog.size/2 < l.x + l.w) {
            onLog = true;
            logSpeed = l.speed;
        }
    });

    // Víz szabály
    if(frog.lane === 2 || frog.lane === 3) {
        if(onLog) frog.x += logSpeed;
        else stopGame("Beleestél a vízbe! 🌊", false);
    }

    // Vonat
    if(!train.active) {
        if(Math.random() < 0.005) { train.active = true; train.x = -train.width; trainLight = "red"; }
        else trainLight = "green";
    } else {
        train.x += train.speed;
        if(train.x > width + 500) { train.active = false; trainLight = "green"; }
        if(frog.lane === train.lane && frog.x < train.x + train.width && frog.x + frog.size > train.x) {
            stopGame("A vonat elgázolt! 🚂", false);
        }
    }

    // Pálya határok
    if(frog.x < 0) frog.x = 0;
    if(frog.x > width - frog.size) frog.x = width - frog.size;

    // Győzelem
    if(frog.lane < 0) {
        stopGame("Szép munka! Jöhet a következő!", true);
    }
}

// --- RAJZOLÁS ---
function draw() {
    // Háttér
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, width, height);

    // Sávok
    for(let i=0; i<lanes; i++) {
        let y = i * laneH;
        if(i===2 || i===3) ctx.fillStyle = "#3498db"; // Víz
        else if(i===4) ctx.fillStyle = "#2c3e50"; // Sín alap
        else if(i===0 || i===lanes-1) ctx.fillStyle = "#7f8c8d"; // Járda
        else ctx.fillStyle = "#555"; // Út
        
        ctx.fillRect(0, y, width, laneH);
        
        // Elválasztó vonalak
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke();
    }

    // Sín (4-es sáv)
    let ty = 4 * laneH + laneH/2;
    ctx.strokeStyle = "#95a5a6"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, ty-10); ctx.lineTo(width, ty-10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, ty+10); ctx.lineTo(width, ty+10); ctx.stroke();
    for(let x=0; x<width; x+=40) { ctx.beginPath(); ctx.moveTo(x, ty-15); ctx.lineTo(x, ty+15); ctx.stroke(); }
    
    // Lámpa
    ctx.fillStyle = (trainLight==="red") ? "#e74c3c" : "#550000"; ctx.beginPath(); ctx.arc(width-40, ty-25, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = (trainLight==="green") ? "#2ecc71" : "#005500"; ctx.beginPath(); ctx.arc(width-40, ty-8, 8, 0, Math.PI*2); ctx.fill();

    // Deszkák
    ctx.fillStyle = "#d35400";
    logs.forEach(l => {
        let ly = l.lane * laneH + (laneH - l.h)/2;
        ctx.fillRect(l.x, ly, l.w, l.h);
        ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.fillRect(l.x, ly+5, l.w, 5); ctx.fillStyle = "#d35400"; // Árnyék
    });

    // Autók
    cars.forEach(c => {
        let cy = c.lane * laneH + (laneH - c.h)/2;
        ctx.fillStyle = "#e74c3c"; // Piros autó
        ctx.fillRect(c.x, cy, c.w, c.h);
        ctx.fillStyle = "#ecf0f1"; // Ablak
        ctx.fillRect(c.x+5, cy+5, c.w-10, c.h/2);
        // Kerék
        ctx.fillStyle="black"; ctx.fillRect(c.x+10, cy+c.h, 10, 4); ctx.fillRect(c.x+c.w-20, cy+c.h, 10, 4);
    });

    // Vonat
    if(train.active) {
        let ty = train.lane * laneH + (laneH - 40)/2;
        ctx.fillStyle = "#8e44ad";
        ctx.fillRect(train.x, ty, train.width, 40);
        ctx.fillStyle = "#f1c40f"; // Ablakok
        for(let k=20; k<train.width; k+=60) ctx.fillRect(train.x+k, ty+5, 40, 15);
    }

    // BÉKA
    if(gameState === "playing") {
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(frog.x, frog.y, frog.size, frog.size);
        // Szem
        ctx.fillStyle = "white"; 
        ctx.fillRect(frog.x+5, frog.y+5, 8, 8); 
        ctx.fillRect(frog.x+17, frog.y+5, 8, 8);
        ctx.fillStyle = "black"; 
        ctx.fillRect(frog.x+7, frog.y+7, 4, 4); 
        ctx.fillRect(frog.x+19, frog.y+7, 4, 4);
    }
}

// --- FŐ CIKLUS ---
function loop() {
    update();
    draw();
    if(gameState === "playing") requestAnimationFrame(loop);
}

// Kezdő képernyő kirajzolása egyszer
msgBox.style.display = "block";
resize();

</script>
</body>
</html>
