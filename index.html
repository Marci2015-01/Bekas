<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Végtelen Béka - Pro Verzió</title>
<style>
    html, body {
        margin: 0; padding: 0; 
        height: 100%; width: 100%;
        overflow: hidden; 
        background-color: #1a1a1a;
        font-family: 'Segoe UI', sans-serif;
        touch-action: none; user-select: none;
    }
    canvas { display: block; }
    
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; display: flex; justify-content: center; align-items: center; z-index: 50;
    }
    #msg-box {
        background: rgba(20, 20, 25, 0.95); color: white; padding: 40px;
        border-radius: 25px; text-align: center; border: 4px solid #f1c40f;
        pointer-events: auto; min-width: 300px; box-shadow: 0 0 50px rgba(0,0,0,0.8);
        backdrop-filter: blur(10px);
    }
    h1 { margin: 0 0 10px 0; color: #f1c40f; text-shadow: 2px 2px 0px #d35400; }
    p { margin-bottom: 25px; font-size: 18px; }
    
    button.big-btn {
        background: linear-gradient(to bottom, #f39c12, #e67e22);
        color: white; border: none; padding: 18px 35px; 
        font-size: 22px; border-radius: 12px; cursor: pointer; width: 100%; 
        font-weight: bold; box-shadow: 0 5px 0 #a04000; transition: 0.1s;
    }
    button.big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #a04000; }

    #hud {
        position: absolute; top: 20px; left: 20px;
        background: rgba(0,0,0,0.7); color: white;
        padding: 10px 20px; border-radius: 50px; font-weight: bold;
        z-index: 10; border: 2px solid #f1c40f; font-size: 20px;
    }

    #controls {
        position: absolute; bottom: 30px; right: 30px;
        width: 180px; height: 130px; z-index: 100;
        display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px;
    }
    .ctrl-btn {
        background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4);
        border-radius: 15px; color: white; display: flex; justify-content: center; align-items: center;
        font-size: 24px; pointer-events: auto;
    }
    .ctrl-btn:active { background: rgba(241, 196, 15, 0.6); }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>

<div id="hud">SZINT: <span id="lvl-num" style="color:#f1c40f">1</span></div>

<div id="ui-layer">
    <div id="msg-box">
        <h1 id="msg-title">BÉKA KALAND</h1>
        <p id="msg-text">A haladásod elmentve!</p>
        <button class="big-btn" id="start-btn">JÁTÉK INDÍTÁSA</button>
    </div>
</div>

<div id="controls">
    <div class="ctrl-btn" id="btn-up">▲</div>
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-down">▼</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const uiLayer = document.getElementById("ui-layer");
const msgTitle = document.getElementById("msg-title");
const msgText = document.getElementById("msg-text");
const startBtn = document.getElementById("start-btn");
const lvlNum = document.getElementById("lvl-num");

let width, height;
const laneH = 85; 
let level = 1;
let state = "menu";
let map = [];
let frog = { x:0, y:0, targetX:0, targetY:0, lane:0, size:50 };
let entities = [];
let trains = [];
let cameraY = 0;
let frameCount = 0;

function generateMapLayout(lvl) {
    map = [];
    map.push({ type: 'goal' });
    let totalLanes = 10 + Math.min(lvl * 2, 40); // Ne legyen végtelenül hosszú, de nehéz igen

    for(let i=1; i < totalLanes - 1; i++) {
        let rnd = Math.random();
        if (rnd < 0.15) map.push({ type: 'grass' });
        else if (rnd < 0.45) map.push({ type: 'water', dir: (Math.random()>0.5?1:-1), speed: (1.5 + lvl*0.08) + Math.random() });
        else if (rnd < 0.55 && lvl > 1) map.push({ type: 'train', active: false, cooldown: 100 });
        else map.push({ type: 'road', dir: (Math.random()>0.5?1:-1), speed: (2.0 + lvl*0.15) + Math.random() });
    }
    map.push({ type: 'start' });
    return map.length;
}

function resize() {
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = width; canvas.height = height;
    if(state === "playing") updateFrogPos(true);
}
window.addEventListener('resize', resize);

function startGame() {
    generateMapLayout(level);
    frog.lane = map.length - 1;
    frog.targetX = width/2 - frog.size/2;
    updateFrogPos(true);

    entities = []; trains = [];
    map.forEach((lane, index) => {
        let count = 2 + Math.floor(Math.random() * 2);
        if(lane.type === 'road') {
            for(let k=0; k<count; k++) {
                entities.push({
                    type: 'car', lane: index, x: Math.random() * width, 
                    w: 110, h: 55, speed: lane.speed * lane.dir,
                    color: ["#e74c3c", "#f1c40f", "#3498db", "#e67e22", "#9b59b6"][Math.floor(Math.random()*5)]
                });
            }
        } else if(lane.type === 'water') {
            for(let k=0; k<count; k++) {
                entities.push({
                    type: 'log', lane: index, x: Math.random() * width,
                    w: 170, h: 50, speed: lane.speed * lane.dir
                });
            }
        } else if(lane.type === 'train') {
            trains.push({ lane: index, x: -3000, active: false, cooldown: 100 + Math.random()*200 });
        }
    });

    state = "playing";
    uiLayer.style.display = "none";
}

function updateFrogPos(instant = false) {
    frog.targetY = frog.lane * laneH + (laneH - frog.size)/2;
    if(instant) { 
        frog.y = frog.targetY; 
        frog.x = frog.targetX;
        cameraY = frog.y - height/2;
    }
}

function gameOver(win, reason) {
    state = "menu";
    uiLayer.style.display = "flex";
    if(win) {
        level++;
        lvlNum.textContent = level;
        msgTitle.textContent = "SZINT TELJESÍTVE!";
        msgTitle.style.color = "#2ecc71";
        msgText.textContent = "Gratulálok! Jöhet a(z) " + level + ". szint?";
        startBtn.textContent = "KÖVETKEZŐ SZINT";
    } else {
        // NEM esik vissza az 1. szintre!
        msgTitle.textContent = "ELTÉVEDTÉL!";
        msgTitle.style.color = "#e74c3c";
        msgText.textContent = reason + " De a(z) " + level + ". szinten maradsz!";
        startBtn.textContent = "ÚJRAKEZDÉS";
    }
}

function move(dir) {
    if(state !== "playing") return;
    if(dir === 'up' && frog.lane > 0) frog.lane--;
    else if(dir === 'down' && frog.lane < map.length-1) frog.lane++;
    else if(dir === 'left') frog.targetX -= 80;
    else if(dir === 'right') frog.targetX += 80;
    
    updateFrogPos();
    if(frog.lane === 0) gameOver(true, "");
}

// Controls
document.addEventListener("keydown", e => {
    if(e.key.includes("Up") || e.key === "w") move('up');
    if(e.key.includes("Down") || e.key === "s") move('down');
    if(e.key.includes("Left") || e.key === "a") move('left');
    if(e.key.includes("Right") || e.key === "d") move('right');
});

const setupBtn = (id, dir) => {
    const b = document.getElementById(id);
    b.addEventListener("touchstart", (e) => { e.preventDefault(); move(dir); }, {passive:false});
    b.addEventListener("mousedown", (e) => { e.preventDefault(); move(dir); });
};
setupBtn("btn-up", "up"); setupBtn("btn-down", "down"); setupBtn("btn-left", "left"); setupBtn("btn-right", "right");

function loop() {
    frameCount++;
    if(state === "playing") {
        // SMOOTH MOVEMENT (INTERPOLATION)
        frog.y += (frog.targetY - frog.y) * 0.22;
        frog.x += (frog.targetX - frog.x) * 0.22;

        let targetCam = frog.y - height / 2;
        cameraY += (targetCam - cameraY) * 0.1;
        const maxScroll = (map.length * laneH) - height;
        if(cameraY < 0) cameraY = 0;
        if(cameraY > maxScroll) cameraY = maxScroll;

        entities.forEach(e => {
            e.x += e.speed;
            if(e.speed > 0 && e.x > width) e.x = -e.w;
            if(e.speed < 0 && e.x < -e.w) e.x = width;
        });

        trains.forEach(t => {
            if(!t.active) {
                t.cooldown--;
                if(t.cooldown <= 0) { t.active = true; t.x = -2500; }
            } else {
                t.x += 45;
                if(t.x > width + 1000) { t.active = false; t.cooldown = 200 + Math.random()*300; }
                if(frog.lane === t.lane && frog.x < t.x + 1500 && frog.x + frog.size > t.x) gameOver(false, "Elütött a gyorsvonat!");
            }
        });

        let onLog = false;
        entities.forEach(e => {
            if(e.lane === frog.lane) {
                if(e.type === 'car' && frog.x < e.x + e.w - 15 && frog.x + frog.size > e.x + 15) gameOver(false, "Vigyázz az autókkal!");
                if(e.type === 'log' && frog.x + frog.size/2 > e.x && frog.x + frog.size/2 < e.x + e.w) {
                    onLog = true; 
                    // Ha rönkön vagy, a célpontod is sodródik!
                    frog.targetX += e.speed;
                }
            }
        });

        if(map[frog.lane].type === 'water' && !onLog) gameOver(false, "Vigyázz, mély a víz!");
        if(frog.targetX < 0) frog.targetX = 0;
        if(frog.targetX > width - frog.size) frog.targetX = width - frog.size;
    }
    draw();
    requestAnimationFrame(loop);
}

function draw() {
    ctx.clearRect(0,0,width,height);
    ctx.save();
    ctx.translate(0, -cameraY);

    map.forEach((lane, i) => {
        let y = i * laneH;
        if (y + laneH < cameraY || y > cameraY + height) return;
        let grad = ctx.createLinearGradient(0, y, 0, y + laneH);
        if(lane.type === 'grass' || lane.type === 'start') {
            grad.addColorStop(0, "#2ecc71"); grad.addColorStop(1, "#27ae60");
        } else if(lane.type === 'road') {
            grad.addColorStop(0, "#34495e"); grad.addColorStop(1, "#2c3e50");
        } else if(lane.type === 'water') {
            grad.addColorStop(0, "#2980b9"); grad.addColorStop(1, "#3498db");
        } else if(lane.type === 'train') {
            grad.addColorStop(0, "#1a1a1a"); grad.addColorStop(1, "#222");
        } else if(lane.type === 'goal') {
            grad.addColorStop(0, "#f1c40f"); grad.addColorStop(1, "#f39c12");
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, y, width, laneH);
        
        if(lane.type === 'road') {
            ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.setLineDash([30, 30]);
            ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, y+laneH/2); ctx.lineTo(width, y+laneH/2); ctx.stroke(); ctx.setLineDash([]);
        }
    });

    entities.forEach(e => {
        let y = e.lane * laneH + (laneH - e.h)/2;
        if (y + e.h < cameraY || y > cameraY + height) return;
        ctx.fillStyle = e.type === 'car' ? e.color : "#7e4a35";
        roundRect(ctx, e.x, y, e.w, e.h, 10, true);
    });

    trains.forEach(t => {
        if(t.active) {
            let ty = t.lane * laneH + (laneH - 50)/2;
            ctx.fillStyle = "#34495e"; ctx.fillRect(t.x, ty, 2000, 50);
            ctx.fillStyle = "#f1c40f"; for(let w=0; w<2000; w+=100) ctx.fillRect(t.x+w+10, ty+10, 50, 10);
        }
    });

    // BÉKA
    ctx.shadowBlur = 15; ctx.shadowColor = "rgba(0,0,0,0.4)";
    ctx.fillStyle = "#2ecc71";
    roundRect(ctx, frog.x, frog.y, frog.size, frog.size, 15, true);
    ctx.fillStyle = "white"; 
    ctx.beginPath(); ctx.arc(frog.x+15, frog.y+15, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(frog.x+frog.size-15, frog.y+15, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "black";
    ctx.beginPath(); ctx.arc(frog.x+15, frog.y+13, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(frog.x+frog.size-15, frog.y+13, 4, 0, Math.PI*2); ctx.fill();

    ctx.restore();
}

function roundRect(ctx, x, y, width, height, radius, fill) {
    ctx.beginPath(); ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius); ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height); ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius); ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y); ctx.closePath();
    if (fill) ctx.fill();
}

startBtn.addEventListener("click", startGame);
resize();
loop();
</script>
</body>
</html>
