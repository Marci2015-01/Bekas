<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Végtelen Béka - Variálható Pályák</title>
<style>
    html, body {
        margin: 0; padding: 0; 
        height: 100%; width: 100%;
        overflow: hidden; 
        background-color: #222;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        touch-action: none; user-select: none;
    }
    canvas { display: block; }
    
    /* UI */
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        display: flex; justify-content: center; align-items: center;
        z-index: 50;
    }
    #msg-box {
        background: rgba(0,0,0,0.95); color: white; padding: 25px;
        border-radius: 15px; text-align: center; border: 4px solid #f39c12;
        pointer-events: auto; min-width: 280px; box-shadow: 0 0 30px rgba(0,0,0,0.7);
    }
    h1 { margin: 0 0 10px 0; font-size: 28px; color: #f39c12; text-transform: uppercase; }
    p { color: #ccc; margin-bottom: 20px; font-size: 14px; }
    
    button.big-btn {
        background: #e67e22; color: white; border: none; padding: 15px 30px; 
        font-size: 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold;
    }
    button.big-btn:active { transform: scale(0.96); background: #d35400; }

    /* HUD */
    #hud {
        position: absolute; top: 10px; left: 10px;
        background: rgba(0,0,0,0.7); color: white;
        padding: 5px 15px; border-radius: 20px; font-weight: bold;
        z-index: 10; border: 1px solid #555;
    }
    #game-info { position: absolute; top: 10px; right: 10px; color: #aaa; font-size: 12px; z-index: 10; }

    /* Vezérlés */
    #controls {
        position: absolute; bottom: 20px; right: 20px;
        width: 160px; height: 120px; z-index: 100;
        display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr;
        gap: 5px; opacity: 0.5;
    }
    .ctrl-btn {
        background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
        border-radius: 8px; color: white; display: flex; justify-content: center; align-items: center;
        font-size: 20px; pointer-events: auto;
    }
    .ctrl-btn:active, .active-key { background: rgba(255,255,255,0.5); }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>

<div id="hud">SZINT: <span id="lvl-num" style="color:#f1c40f">1</span></div>
<div id="game-info">Véletlenszerű pályák</div>

<div id="ui-layer">
    <div id="msg-box">
        <h1 id="msg-title">BÉKA KALAND</h1>
        <p id="msg-text">Minden szint új kihívás és más elrendezés!</p>
        <button class="big-btn" id="start-btn">JÁTÉK INDÍTÁSA</button>
    </div>
</div>

<div id="controls">
    <div class="ctrl-btn" id="btn-up">▲</div>
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-down">▼</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const uiLayer = document.getElementById("ui-layer");
const msgBox = document.getElementById("msg-box");
const msgTitle = document.getElementById("msg-title");
const msgText = document.getElementById("msg-text");
const startBtn = document.getElementById("start-btn");
const lvlNum = document.getElementById("lvl-num");

let width, height, laneH;
let level = 1;
let state = "menu"; // menu, playing
let map = []; // Tárolja a pályaszerkezetet
let frog = { x:0, y:0, lane:0, size:30 };
let entities = []; // Autók, farönkök vegyesen
let trains = [];   // Vonatok állapota

// --- PÁLYA GENERÁLÁS (A LÉNYEG) ---
function generateMapLayout(lvl) {
    map = [];
    // 0. sáv mindig a Cél
    map.push({ type: 'goal' });

    // Nehézség alapú hossz: Min 7 sáv, Max 14 sáv
    let extraLanes = Math.min(Math.floor(lvl / 2), 6);
    let totalLanes = 7 + extraLanes;

    // Köztes sávok generálása
    for(let i=1; i < totalLanes - 1; i++) {
        let rnd = Math.random();
        
        // Biztonsági sáv (fű) - ne legyen túl ritka
        if (rnd < 0.2 || (i > 1 && map[i-1].type !== 'grass' && map[i-2].type !== 'grass' && Math.random() < 0.5)) {
            map.push({ type: 'grass' });
        }
        // Víz
        else if (rnd < 0.5) {
            map.push({ type: 'water', dir: (i%2==0?1:-1), speed: (1.5 + lvl*0.2) + Math.random() });
        }
        // Vonat (ritkább, de veszélyes)
        else if (rnd < 0.65 && lvl > 1) {
            map.push({ type: 'train', active: false, timer: 0, x: -1500 });
        }
        // Út
        else {
            map.push({ type: 'road', dir: (i%2==0?1:-1), speed: (2.5 + lvl*0.3) + Math.random() });
        }
    }

    // Utolsó sáv mindig Start (fű)
    map.push({ type: 'start' });
    
    return map.length;
}

// --- MÉRETEZÉS ---
function resize() {
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = width; canvas.height = height;
    if(state === "playing") {
        laneH = height / map.length;
        frog.size = Math.min(laneH * 0.75, 50);
        updateFrogY();
    }
}
window.addEventListener('resize', resize);

// --- INDÍTÁS ---
startBtn.addEventListener("click", startGame);

function startGame() {
    let lanesCount = generateMapLayout(level);
    
    // Számoljuk újra a méreteket az új pályához
    laneH = height / lanesCount;
    frog.size = Math.min(laneH * 0.75, 50);
    
    // Béka pozíció
    frog.lane = lanesCount - 1;
    frog.x = width/2 - frog.size/2;
    updateFrogY();

    // Entitások feltöltése a map alapján
    entities = [];
    trains = [];
    
    map.forEach((lane, index) => {
        if(lane.type === 'road') {
            // Autók generálása
            let count = 1 + Math.floor(Math.random() * 2) + (width > 800 ? 1 : 0);
            for(let k=0; k<count; k++) {
                entities.push({
                    type: 'car', lane: index, 
                    x: Math.random() * width, 
                    w: width < 600 ? 60 : 80, 
                    h: frog.size, 
                    speed: lane.speed * lane.dir,
                    color: ["#e74c3c", "#f1c40f", "#9b59b6", "#e67e22"][Math.floor(Math.random()*4)]
                });
            }
        }
        else if(lane.type === 'water') {
            // Rönkök generálása
            let count = 2 + Math.floor(Math.random() * 2);
            for(let k=0; k<count; k++) {
                entities.push({
                    type: 'log', lane: index,
                    x: Math.random() * width,
                    w: width < 600 ? 90 : 120 + Math.random()*50,
                    h: frog.size * 0.85,
                    speed: lane.speed * lane.dir
                });
            }
        }
        else if(lane.type === 'train') {
            // Vonat inicializálás
            trains.push({ lane: index, x: -2000, active: false, cooldown: Math.random()*200, lightState: 'green' });
        }
    });

    state = "playing";
    uiLayer.style.display = "none";
}

function updateFrogY() { frog.y = frog.lane * laneH + (laneH - frog.size)/2; }

// --- JÁTÉK LOGIKA ---
function gameOver(win, reason) {
    state = "menu";
    uiLayer.style.display = "flex";
    if(win) {
        level++;
        lvlNum.textContent = level;
        msgTitle.textContent = "SZINT TELJESÍTVE!";
        msgTitle.style.color = "#2ecc71";
        msgText.textContent = "A következő pálya hosszabb lehet!";
        startBtn.textContent = "KÖVETKEZŐ SZINT";
    } else {
        level = 1;
        lvlNum.textContent = level;
        msgTitle.textContent = "VÉGE!";
        msgTitle.style.color = "#e74c3c";
        msgText.textContent = reason;
        startBtn.textContent = "ÚJRAKEZDÉS";
    }
}

function move(dir) {
    if(state !== "playing") return;
    if(dir === 'up') { frog.lane--; }
    else if(dir === 'down') { if(frog.lane < map.length-1) frog.lane++; }
    else if(dir === 'left') { frog.x -= frog.size + 10; }
    else if(dir === 'right') { frog.x += frog.size + 10; }
    updateFrogY();
    checkWin();
}

function checkWin() {
    if(frog.lane === 0) gameOver(true, "");
}

// Billentyűzet
document.addEventListener("keydown", e => {
    if(state !== "playing") return;
    if(e.key==="ArrowUp"||e.key==="w") { move('up'); highlight("btn-up"); }
    if(e.key==="ArrowDown"||e.key==="s") { move('down'); highlight("btn-down"); }
    if(e.key==="ArrowLeft"||e.key==="a") { move('left'); highlight("btn-left"); }
    if(e.key==="ArrowRight"||e.key==="d") { move('right'); highlight("btn-right"); }
});

// Érintőgombok
function setupBtn(id, dir) {
    document.getElementById(id).addEventListener("touchstart", (e)=>{ e.preventDefault(); move(dir); highlight(id); }, {passive:false});
    document.getElementById(id).addEventListener("mousedown", (e)=>{ e.preventDefault(); move(dir); highlight(id); });
}
setupBtn("btn-up", "up"); setupBtn("btn-down", "down"); setupBtn("btn-left", "left"); setupBtn("btn-right", "right");
function highlight(id) { document.getElementById(id).classList.add("active-key"); setTimeout(()=>document.getElementById(id).classList.remove("active-key"), 100); }

// --- LOOP ---
function loop() {
    if(state === "playing") {
        // 1. Entitások mozgatása (Autók és Rönkök)
        entities.forEach(e => {
            e.x += e.speed;
            if(e.speed > 0 && e.x > width) e.x = -e.w;
            if(e.speed < 0 && e.x < -e.w) e.x = width;
        });

        // 2. Vonatok logikája (több vonat is lehet!)
        trains.forEach(t => {
            if(!t.active) {
                t.cooldown--;
                if(t.cooldown <= 0 && Math.random() < 0.02) {
                    t.active = true;
                    t.x = -1500; // Hosszú vonat
                    t.lightState = 'red';
                } else {
                    t.lightState = (t.cooldown < 60 && t.cooldown % 10 < 5) ? 'red' : 'green'; // Villogás előtt
                }
            } else {
                t.x += 25; // Vonat sebesség
                if(t.x > width + 500) {
                    t.active = false;
                    t.cooldown = 100 + Math.random() * 200;
                    t.lightState = 'green';
                }
                // Ütközés vonattal
                if(frog.lane === t.lane && frog.x < t.x + 1200 && frog.x + frog.size > t.x) {
                    gameOver(false, "A vonat nem áll meg!");
                }
            }
        });

        // 3. Béka logikája
        let currentLaneType = map[frog.lane].type;
        let onLog = false;
        let logSpeed = 0;

        // Ütközésvizsgálat (Autók és Rönkön állás)
        entities.forEach(e => {
            if(e.lane === frog.lane) {
                // Autó ütközés
                if(e.type === 'car') {
                    if(frog.x < e.x + e.w - 5 && frog.x + frog.size > e.x + 5) {
                        gameOver(false, "Elcsaptak!");
                    }
                }
                // Rönkön állás
                if(e.type === 'log') {
                    if(frog.x + frog.size/2 > e.x && frog.x + frog.size/2 < e.x + e.w) {
                        onLog = true;
                        logSpeed = e.speed;
                    }
                }
            }
        });

        // Víz ellenőrzés
        if(currentLaneType === 'water') {
            if(onLog) {
                frog.x += logSpeed;
            } else {
                gameOver(false, "A béka nem tud úszni!");
            }
        }

        // Falak
        if(frog.x < 0) frog.x = 0;
        if(frog.x > width - frog.size) frog.x = width - frog.size;
    }

    draw();
    requestAnimationFrame(loop);
}

// --- RAJZOLÁS ---
function draw() {
    // Háttér törlés
    ctx.fillStyle = "#222"; ctx.fillRect(0,0,width,height);

    if(map.length === 0) return; // Még nincs generálva

    // Pálya rajzolása sávonként
    for(let i=0; i<map.length; i++) {
        let y = i * laneH;
        let type = map[i].type;

        if(type === 'grass' || type === 'start') {
            ctx.fillStyle = "#27ae60"; ctx.fillRect(0, y, width, laneH);
            // Fűcsomók
            ctx.fillStyle = "#2ecc71"; 
            for(let g=0; g<width; g+=50) ctx.fillRect(g+(i%2)*20, y+5, 5, 5);
        }
        else if(type === 'road') {
            ctx.fillStyle = "#34495e"; ctx.fillRect(0, y, width, laneH);
            ctx.strokeStyle = "#95a5a6"; ctx.setLineDash([20, 20]); ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke(); ctx.setLineDash([]);
        }
        else if(type === 'water') {
            ctx.fillStyle = "#3498db"; ctx.fillRect(0, y, width, laneH);
        }
        else if(type === 'train') {
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(0, y, width, laneH);
            let ty = y + laneH/2;
            ctx.strokeStyle = "#555"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, ty-10); ctx.lineTo(width, ty-10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, ty+10); ctx.lineTo(width, ty+10); ctx.stroke();
            // Talpfák
            ctx.fillStyle = "#111";
            for(let tx=0; tx<width; tx+=30) ctx.fillRect(tx, ty-15, 6, 30);
        }
        else if(type === 'goal') {
            ctx.fillStyle = "#f1c40f"; ctx.fillRect(0, y, width, laneH);
            ctx.fillStyle = "#d35400"; 
            for(let cx=0; cx<width; cx+=60) {
                ctx.beginPath(); ctx.arc(cx+30, y+laneH/2, 10, 0, Math.PI*2); ctx.fill();
            }
        }
    }

    // Entitások rajzolása
    entities.forEach(e => {
        let y = e.lane * laneH + (laneH - e.h)/2;
        if(e.type === 'car') {
            // Kerék
            ctx.fillStyle = "#111";
            ctx.fillRect(e.x+5, y-2, 12, 6); ctx.fillRect(e.x+e.w-17, y-2, 12, 6);
            ctx.fillRect(e.x+5, y+e.h-4, 12, 6); ctx.fillRect(e.x+e.w-17, y+e.h-4, 12, 6);
            // Kasztni
            ctx.fillStyle = e.color; ctx.fillRect(e.x, y, e.w, e.h);
            ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(e.x+10, y+5, e.w-20, e.h-10);
        } else if (e.type === 'log') {
            ctx.fillStyle = "#d35400"; ctx.fillRect(e.x, y, e.w, e.h);
            ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.fillRect(e.x+5, y+5, e.w-10, 5);
        }
    });

    // Vonatok és lámpák
    trains.forEach(t => {
        let ty = t.lane * laneH + (laneH - 40)/2;
        // Lámpa
        let lampX = width - 40;
        let lampY = t.lane * laneH + laneH/2;
        ctx.fillStyle = "#000"; ctx.fillRect(lampX, lampY-25, 20, 50);
        ctx.fillStyle = t.lightState === 'red' ? "#ff0000" : "#550000"; ctx.beginPath(); ctx.arc(lampX+10, lampY-12, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = t.lightState === 'green' ? "#00ff00" : "#005500"; ctx.beginPath(); ctx.arc(lampX+10, lampY+12, 6, 0, Math.PI*2); ctx.fill();

        if(t.active) {
            ctx.fillStyle = "#8e44ad"; ctx.fillRect(t.x, ty, 1200, 40);
            ctx.fillStyle = "#f1c40f"; 
            for(let w=20; w<1200; w+=80) ctx.fillRect(t.x+w, ty+5, 40, 15);
        }
    });

    // BÉKA
    if(state === "playing" || state === "menu") {
        // Test
        ctx.fillStyle = "#2ecc71"; ctx.fillRect(frog.x, frog.y, frog.size, frog.size);
        // Óriás szemek
        let eyeR = frog.size * 0.35;
        let eyeY = frog.y - eyeR*0.2;
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.arc(frog.x+eyeR, eyeY, eyeR, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(frog.x+frog.size-eyeR, eyeY, eyeR, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath(); ctx.arc(frog.x+eyeR, eyeY, eyeR*0.4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(frog.x+frog.size-eyeR, eyeY, eyeR*0.4, 0, Math.PI*2); ctx.fill();
    }
}

// Inicializálás első indításkor (csak a méret miatt)
resize();
loop();
</script>
</body>
</html>
