<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Végtelen Béka - FIXED LOOP & MUSIC</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
<style>
    :root { --accent: #00f2ff; --warn: #ff0040; --bg: #050505; }
    html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        overflow: hidden; background: var(--bg);
        font-family: 'Rajdhani', sans-serif;
        touch-action: none; user-select: none;
    }
    canvas { display: block; }
    
    /* HUD */
    #hud {
        position: absolute; top: 20px; left: 20px; right: 20px;
        display: flex; justify-content: space-between;
        color: white; z-index: 100; pointer-events: none;
        text-transform: uppercase;
    }
    .hud-box {
        background: rgba(0, 0, 0, 0.6);
        border-left: 4px solid var(--accent);
        padding: 8px 20px;
        backdrop-filter: blur(8px);
        transform: skewX(-15deg);
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .hud-label { font-size: 12px; opacity: 0.8; font-weight: 700; transform: skewX(15deg); display:block; letter-spacing: 2px; }
    .stat-val { color: #fff; font-weight: 900; font-size: 28px; transform: skewX(15deg); display: block; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
    
    #pause-btn {
        pointer-events: auto; cursor: pointer;
        background: rgba(255,255,255,0.1); width: 40px; height: 40px;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid rgba(255,255,255,0.2); transform: skewX(-10deg);
        margin-right: 15px; transition: 0.2s; font-weight: 900;
    }

    /* PENALTY BAR */
    #penalty-bar-container {
        position: absolute; top: 90px; left: 50%; transform: translateX(-50%) skewX(-15deg);
        width: 260px; height: 10px; background: rgba(50, 0, 0, 0.8);
        display: none; border: 2px solid var(--warn);
        box-shadow: 0 0 30px var(--warn); z-index: 90;
    }
    #penalty-bar { width: 100%; height: 100%; background: var(--warn); }
    #penalty-text {
        position: absolute; top: -30px; width: 100%; text-align: center;
        color: var(--warn); font-size: 24px; font-weight: 900; letter-spacing: 4px;
        text-shadow: 0 0 15px var(--warn);
    }

    /* MENÜ UI */
    #ui-layer {
        position: absolute; inset: 0;
        display: flex; justify-content: center; align-items: center;
        z-index: 999;
        background: radial-gradient(circle, rgba(20,20,20,0.95) 0%, rgba(0,0,0,1) 100%);
        backdrop-filter: blur(10px);
    }
    
    .panel {
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid rgba(255,255,255,0.1);
        border-top: 6px solid var(--accent);
        border-bottom: 2px solid var(--accent);
        color: white; padding: 30px; 
        width: 85%; max-width: 400px;
        box-shadow: 0 0 60px rgba(0,0,0,0.8);
        transform: skewX(-5deg);
        position: relative; overflow: hidden;
        display: none;
    }
    
    .panel-content { transform: skewX(5deg); text-align: center; position: relative; z-index: 2; }

    h1 {
        font-size: 56px; margin: 0; line-height: 0.9;
        color: #fff; text-transform: uppercase; letter-spacing: -2px;
        text-shadow: 4px 4px 0px rgba(0,0,0,0.5), 0 0 30px var(--accent);
    }
    
    .weather-badge {
        background: var(--accent); color: #000; padding: 4px 10px; font-weight: 900; font-size: 14px;
        position: absolute; top: -10px; right: -15px; transform: rotate(10deg);
        box-shadow: 0 0 20px var(--accent); text-transform: uppercase;
    }
    
    .menu-btn {
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%);
        color: #fff; border: 1px solid rgba(255,255,255,0.2); 
        border-left: 4px solid var(--accent); border-right: 4px solid var(--accent);
        padding: 15px; margin: 10px 0;
        font-size: 18px; cursor: pointer; width: 100%; 
        font-weight: 800; text-transform: uppercase; letter-spacing: 2px; 
        font-family: 'Rajdhani', sans-serif;
        transition: 0.2s;
    }
    .menu-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }
    .menu-btn:active { transform: scale(0.98); }

    .reset-btn {
        margin-top: 20px; font-size: 12px; color: #ff4444; background: transparent; 
        border: 1px solid #ff4444; padding: 8px; cursor: pointer; opacity: 0.7;
    }

    .skin-card {
        background: rgba(0,0,0,0.3); padding: 10px; cursor: pointer; 
        border: 1px solid rgba(255,255,255,0.1);
        display: flex; flex-direction: column; align-items: center;
    }
    .skin-card.active { border: 2px solid var(--accent); background: rgba(255,255,255,0.1); }
    .skin-preview { width: 35px; height: 35px; border-radius: 50%; margin-bottom: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

    #controls {
        position: absolute; bottom: 30px; right: 30px;
        display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; z-index: 150;
    }
    .ctrl-btn {
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        color: var(--accent); height: 80px; display: flex; 
        justify-content: center; align-items: center; font-size: 24px; backdrop-filter: blur(5px);
        transform: skewX(-10deg); transition: 0.1s;
    }
    .ctrl-btn:active { background: var(--accent); color: #000; }
</style>
</head>
<body>

<div id="hud">
    <div style="display:flex;">
        <div id="pause-btn" onclick="goToMenu()">II</div>
        <div class="hud-box">
            <span class="hud-label">SZINT</span>
            <span id="lvl-num" class="stat-val">1</span>
        </div>
    </div>
    <div id="penalty-bar-container"><div id="penalty-text">LOCKED</div><div id="penalty-bar"></div></div>
    <div class="hud-box" style="border-left:none; border-right:4px solid #ffd700; text-align:right;">
        <span class="hud-label">VAGYON</span>
        <span id="coin-num" class="stat-val" style="color:#ffd700; text-shadow:0 0 10px #ffd700">0</span>
    </div>
</div>

<div id="ui-layer">
    <div id="main-menu" class="panel">
        <div class="panel-content">
            <div style="position:relative; display:inline-block; margin-bottom: 25px;"><h1>FROGGER</h1><div class="weather-badge">ULTIMATE</div></div>
            <button class="menu-btn" onclick="start()">JÁTÉK INDÍTÁSA</button>
            <button class="menu-btn" onclick="openShop()">GARÁZS & SKINEK</button>
            <button class="reset-btn" onclick="fullReset()">⚠️ MENTÉS TÖRLÉSE</button>
        </div>
    </div>
    <div id="shop-box" class="panel">
        <div class="panel-content">
            <h2 style="margin:0 0 20px 0; color:var(--accent);">GARÁZS</h2>
            <div id="skin-grid" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:25px;"></div>
            <button class="menu-btn" onclick="goToMenu()">VISSZA</button>
        </div>
    </div>
    <div id="game-over-box" class="panel" style="border-color:var(--warn);">
        <div class="panel-content">
            <h1 style="font-size:42px; color:var(--warn);">MEGSEMMISÜLTÉL</h1>
            <p style="font-size:18px; color:#fff; margin:20px 0;">PÉNZ: <span id="go-coins" style="color:#ffd700">0</span></p>
            <button class="menu-btn" onclick="start()">ÚJRA</button>
            <button class="menu-btn" onclick="goToMenu()">MENÜ</button>
        </div>
    </div>
</div>

<div id="controls">
    <div class="ctrl-btn" id="btn-up" style="grid-column:2">▲</div>
    <div class="ctrl-btn" id="btn-left" style="grid-column:1; grid-row:2">◀</div>
    <div class="ctrl-btn" id="btn-down" style="grid-column:2; grid-row:2">▼</div>
    <div class="ctrl-btn" id="btn-right" style="grid-column:3; grid-row:2">▶</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// --- MUSIC & AUDIO ENGINE ---
const Sound = {
    ctx: null,
    isPlayingMusic: false,
    musicTimeout: null,
    musicNoteIndex: 0,
    
    // A dallam kottája: [Frekvencia, Hossz (ms)]
    melody: [
        [523, 100], [659, 100], 
        [523, 100], [659, 100], 
        [784, 90], [784, 90], [880, 90], [784, 90], 
        [0, 50],
        [698, 90],
        [698, 90], [659, 90],
        [587, 90],
        [523, 90], [392, 90], [659, 90], [523, 90],
        [0, 200]
    ],

    init: function() { if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } if (this.ctx.state === 'suspended') { this.ctx.resume(); } },
    
    playTone: function(freq, type, duration, vol=0.1) {
        if(!this.ctx || freq <= 0) return; 
        try { 
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); 
            osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime); 
            gain.gain.setValueAtTime(vol, this.ctx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration); 
            osc.connect(gain); gain.connect(this.ctx.destination); 
            osc.start(); osc.stop(this.ctx.currentTime + duration); 
        } catch(e) {}
    },

    startMusic: function() {
        if(this.isPlayingMusic) return;
        this.isPlayingMusic = true;
        this.musicNoteIndex = 0;
        this.playNextNote();
    },

    stopMusic: function() {
        this.isPlayingMusic = false;
        clearTimeout(this.musicTimeout);
    },

    playNextNote: function() {
        if(!this.isPlayingMusic || !this.ctx) return;
        const note = this.melody[this.musicNoteIndex];
        const freq = note[0];
        const duration = note[1] / 1000; 

        if(freq > 0) this.playTone(freq, 'square', duration, 0.05);

        this.musicNoteIndex++;
        if(this.musicNoteIndex >= this.melody.length) this.musicNoteIndex = 0;

        this.musicTimeout = setTimeout(() => { this.playNextNote(); }, note[1]);
    },

    jump: function() { this.playTone(200, 'triangle', 0.1); }, 
    coin: function() { this.playTone(1500, 'sine', 0.1); },
    crash: function() { this.playTone(100, 'sawtooth', 0.5, 0.3); },
    win: function() { this.playTone(600, 'triangle', 0.2); },
    lock: function() { this.playTone(80, 'square', 0.3, 0.2); },
    splash: function() { this.playTone(300, 'sine', 0.2, 0.2); }
};

// --- DATA & CONFIG ---
let level = parseInt(localStorage.getItem('f_pro_lvl')) || 1;
let totalCoins = parseInt(localStorage.getItem('f_pro_coins')) || 0;
let ownedSkins = JSON.parse(localStorage.getItem('f_pro_skins')) || ['#2ecc71'];
let currentSkin = localStorage.getItem('f_pro_curr') || '#2ecc71';

const skins = [
    { name: 'NEON',   c: '#2ecc71', p: 0 }, { name: 'AQUA',   c: '#3498db', p: 50 }, { name: 'MAGMA',  c: '#e74c3c', p: 150 },
    { name: 'TOXIC',  c: '#9b59b6', p: 150 }, { name: 'GOLD',   c: '#ffd700', p: 1000 }, { name: 'ICE', c: '#00d2ff', p: 300 }
];

let width, height, laneH = 100, state = "menu";
let map = [], entities = [], obstacles = [], particles = [], staticCoins = [];
let frame = 0;
let frog = { x:0, y:0, tX:0, tY:0, lane:0, jump:0, color: currentSkin, rot: 0, blinkTimer:0 };
let camY = 0;
let shake = 0, damageFlash = 0;
let combo = 0, comboTimer = 0, comboPenalty = 0;
let weather = 'clear'; 

// --- FUNCTIONS ---
function updateTheme(color) { document.documentElement.style.setProperty('--accent', color); }
updateTheme(currentSkin);
document.getElementById('lvl-num').innerText = level; document.getElementById('coin-num').innerText = totalCoins;

function fullReset() { if(confirm("Mindent törölsz?")) { localStorage.clear(); location.reload(); }}
function goToMenu() { 
    state = "menu"; Sound.stopMusic(); 
    document.getElementById('ui-layer').style.display = 'flex'; document.getElementById('main-menu').style.display = 'block'; document.getElementById('shop-box').style.display = 'none'; document.getElementById('game-over-box').style.display = 'none'; document.getElementById('hud').style.display = 'none'; document.getElementById('controls').style.display = 'none'; 
}
function openShop() { document.getElementById('main-menu').style.display = 'none'; document.getElementById('shop-box').style.display = 'block'; renderShop(); }

function start() {
    Sound.init(); Sound.startMusic(); 
    state = "playing"; generateMap(); 
    frog.lane = map.length - 1; frog.tX = width/2 - 25; frog.tY = frog.lane * laneH + (laneH-55)/2; frog.x = frog.tX; frog.y = frog.tY; camY = frog.y - height/2;
    document.getElementById('ui-layer').style.display = "none"; document.getElementById('hud').style.display = 'flex'; document.getElementById('controls').style.display = 'grid';
    document.getElementById('lvl-num').innerText = level; document.getElementById('coin-num').innerText = totalCoins;
    document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
    particles = []; combo=0; shake=0; comboPenalty=0; document.getElementById('penalty-bar-container').style.display = 'none';
}

function generateMap() {
    map = [{type:'goal'}];
    let len = 15 + Math.min(level, 40);
    for(let i=1; i<len-1; i++) {
        let r = Math.random(); let type = r < 0.1 ? 'rail' : (r < 0.3 ? 'grass' : (r < 0.6 ? 'water' : 'road'));
        map.push({type, d:Math.random()>0.5?1:-1, s:(1.5+(level*0.15))+Math.random()*2, seed: Math.random(), railState: 'dormant', warningTimer: 0});
    }
    map.push({type:'start'});
    entities = []; obstacles = []; staticCoins = [];
    let spawnW = width > 0 ? width : window.innerWidth;
    map.forEach((l, i) => {
        if(l.type==='road' || l.type==='water') {
            let count = 2 + Math.floor(Math.random() * 2); let spacing = spawnW / count;
            for(let k=0; k<count; k++) {
                let offset = (Math.random() * 200) - 100; let subtype = 'sedan'; let vW = 140; let vC = `hsl(${Math.random()*360}, 70%, 50%)`;
                if(l.type === 'road') { if(Math.random() > 0.7) { subtype = 'truck'; vW = 180; vC = '#555'; l.s *= 0.8; } else if(Math.random()<0.2){subtype='sport'; vW=130; vC='#e74c3c'; l.s*=1.2;}}
                entities.push({ t:l.type==='road'?'c':'l', subtype: subtype, lane:i, x: (k * spacing) + offset, w:l.type==='road'?vW:220, s:l.s*l.d, col: l.t==='c' ? vC : '#3d2b1f' });
            }
        }
        if(l.type === 'grass') { let obsCount = Math.floor(Math.random() * 3); for(let r=0; r<obsCount; r++) { obstacles.push({ lane: i, x: Math.random() * (spawnW - 50) + 25, type: Math.random()>0.5?'rock':'tree' }); }}
        if(l.type === 'grass' || l.type === 'road') { if(Math.random() > 0.3) staticCoins.push({ lane: i, x: Math.random() * (spawnW - 50) + 25, active: true }); }
    });
    let wRand = Math.random(); weather = wRand < 0.33 ? 'rain' : (wRand < 0.66 ? 'snow' : 'clear');
}

function move(d) {
    if(state !== "playing") return;
    let targetLane = frog.lane; let targetX = frog.tX;
    if(d==='up') targetLane--; else if(d==='down') targetLane++; else if(d==='left') targetX -= 85; else if(d==='right') targetX += 85;
    if(targetLane < 0 || targetLane >= map.length) return;
    
    let wrapped = false;
    if(targetX < -50) { targetX += width + 100; wrapped = true; }
    if(targetX > width + 50) { targetX -= (width + 100); wrapped = true; }
    
    if(wrapped) { combo = 0; comboPenalty = 300; Sound.lock(); damageFlash = 10; document.getElementById('penalty-bar-container').style.display = 'block'; frog.x = targetX; frog.tX = targetX; }

    let hitObs = false; obstacles.forEach(o => { if(o.lane === targetLane && Math.abs((targetX + 25) - (o.x + 25)) < 40) hitObs = true; });
    if(hitObs) { Sound.playTone(100, 'square', 0.1); return; }

    Sound.jump();
    frog.jump = 1; frog.lane = targetLane; frog.tX = targetX;
    if(d==='left') frog.rot = -1; else if(d==='right') frog.rot = 1; else frog.rot = 0;
    frog.tY = frog.lane * laneH + (laneH-55)/2;
    if(map[frog.lane].type === 'grass' || map[frog.lane].type === 'start') spawnParticles(frog.x+25, frog.y+50, "#3a5f0b", 5, 'smoke');
    
    if(d === 'up' && comboPenalty <= 0) { if(comboTimer > 0) { combo++; totalCoins += combo; document.getElementById('coin-num').innerText = totalCoins; } else { combo = 1; } comboTimer = 60; }

    if(frog.lane === 0) { level++; totalCoins += 100; save(); Sound.win(); document.getElementById('lvl-num').innerText = level; document.getElementById('coin-num').innerText = totalCoins; generateMap(); frog.lane = map.length - 1; frog.tX = width/2 - 25; frog.tY = frog.lane * laneH + (laneH-55)/2; frog.x = frog.tX; frog.y = frog.tY; spawnParticles(width/2, height/2, "#ffd700", 50, "sparkle"); }
}

function collectCoin(amount, x, y) { totalCoins += amount; Sound.coin(); document.getElementById('coin-num').innerText = totalCoins; spawnParticles(x, y, "#ffd700", 10, "sparkle"); }

function endGame() {
    if(state === 'dead') return;
    Sound.stopMusic(); 
    Sound.crash(); state = "dead"; save(); shake = 20; damageFlash = 30;
    setTimeout(() => { document.getElementById('ui-layer').style.display = 'flex'; document.getElementById('game-over-box').style.display = 'block'; document.getElementById('go-coins').innerText = totalCoins; document.getElementById('hud').style.display = 'none'; document.getElementById('controls').style.display = 'none'; }, 500);
}

// DRAWING HELPERS
function drawRock(x,y) { ctx.save(); ctx.translate(x+25,y+30); ctx.shadowColor="rgba(0,0,0,0.8)"; ctx.shadowBlur=15; let g=ctx.createLinearGradient(-15,-15,10,10);g.addColorStop(0,"#555");g.addColorStop(1,"#222");ctx.fillStyle=g; ctx.beginPath();ctx.moveTo(-20,15);ctx.lineTo(-15,-15);ctx.lineTo(15,-20);ctx.lineTo(25,10);ctx.lineTo(15,20);ctx.lineTo(-15,25);ctx.fill(); ctx.fillStyle="rgba(46,204,113,0.2)";ctx.beginPath();ctx.arc(-5,-5,12,0,6.28);ctx.fill(); if(weather==='snow'){ctx.fillStyle="rgba(255,255,255,0.8)";ctx.beginPath();ctx.ellipse(0,-18,15,5,0,0,6.28);ctx.fill();} ctx.restore(); }
function drawTree(x,y) { ctx.save(); ctx.translate(x+25,y+40); ctx.shadowColor="rgba(0,0,0,0.8)"; ctx.shadowBlur=15; ctx.fillStyle="#3e2723"; ctx.fillRect(-5,0,10,20); let c=weather==='snow'?"#3a7a52":"#145a32"; ctx.fillStyle=c; ctx.beginPath();ctx.moveTo(-25,0);ctx.lineTo(25,0);ctx.lineTo(0,-35);ctx.fill(); ctx.beginPath();ctx.moveTo(-20,-20);ctx.lineTo(20,-20);ctx.lineTo(0,-50);ctx.fill(); ctx.beginPath();ctx.moveTo(-15,-40);ctx.lineTo(15,-40);ctx.lineTo(0,-65);ctx.fill(); if(weather==='snow'){ctx.fillStyle="rgba(255,255,255,0.9)";ctx.beginPath();ctx.moveTo(-25,0);ctx.lineTo(25,0);ctx.lineTo(0,-10);ctx.fill();ctx.beginPath();ctx.moveTo(-20,-20);ctx.lineTo(20,-20);ctx.lineTo(0,-30);ctx.fill();} ctx.restore(); }
function drawVehicle(e,y) { const isRight=e.s>0; ctx.save(); ctx.shadowColor="rgba(0,0,0,0.5)"; ctx.shadowBlur=20; if(isRight){let b=ctx.createLinearGradient(e.x+e.w,y+25,e.x+e.w+200,y+25);b.addColorStop(0,"rgba(255,255,200,0.6)");b.addColorStop(1,"transparent");ctx.fillStyle=b;ctx.beginPath();ctx.moveTo(e.x+e.w,y+15);ctx.lineTo(e.x+e.w+200,y-10);ctx.lineTo(e.x+e.w+200,y+60);ctx.lineTo(e.x+e.w,y+35);ctx.fill();} else{let b=ctx.createLinearGradient(e.x,y+25,e.x-200,y+25);b.addColorStop(0,"rgba(255,255,200,0.6)");b.addColorStop(1,"transparent");ctx.fillStyle=b;ctx.beginPath();ctx.moveTo(e.x,y+15);ctx.lineTo(e.x-200,y-10);ctx.lineTo(e.x-200,y+60);ctx.lineTo(e.x,y+35);ctx.fill();} let grad=ctx.createLinearGradient(e.x,y,e.x,y+50);grad.addColorStop(0,e.col);grad.addColorStop(1,"#050505");ctx.fillStyle=grad; if(e.subtype==='truck'){ctx.fillRect(e.x,y-10,e.w,60);ctx.fillStyle="#333";ctx.fillRect(e.x,y-10,e.w,20);ctx.fillStyle="#aaf";ctx.fillRect(e.x+5,y-5,e.w-10,15);} else if(e.subtype==='sport'){ctx.beginPath();if(isRight){ctx.moveTo(e.x,y+15);ctx.lineTo(e.x+40,y+5);ctx.lineTo(e.x+e.w-10,y+8);ctx.lineTo(e.x+e.w,y+25);ctx.lineTo(e.x+e.w,y+45);ctx.lineTo(e.x,y+45);}else{ctx.moveTo(e.x+e.w,y+15);ctx.lineTo(e.x+e.w-40,y+5);ctx.lineTo(e.x+10,y+8);ctx.lineTo(e.x,y+25);ctx.lineTo(e.x,y+45);ctx.lineTo(e.x+e.w,y+45);}ctx.fill();ctx.fillStyle="#aaf";if(isRight)ctx.fillRect(e.x+40,y+8,40,15);else ctx.fillRect(e.x+e.w-80,y+8,40,15);} else{ctx.beginPath();ctx.roundRect(e.x,y+5,e.w,45,8);ctx.fill();ctx.fillStyle="#222";ctx.beginPath();ctx.roundRect(e.x+15,y,e.w-30,40,5);ctx.fill();ctx.fillStyle="#aaf";ctx.beginPath();ctx.roundRect(e.x+20,y+5,e.w-40,25,3);ctx.fill();} ctx.fillStyle="#111";ctx.beginPath();ctx.roundRect(e.x+15,y+40,12,12,3);ctx.fill();ctx.beginPath();ctx.roundRect(e.x+e.w-27,y+40,12,12,3);ctx.fill(); ctx.restore(); }
function drawFrog(x,y,c,j) { ctx.save(); ctx.translate(x+25,y+25); if(j>0.1)ctx.rotate(frog.rot*0.2); ctx.fillStyle="rgba(0,0,0,0.5)";ctx.beginPath();ctx.ellipse(0,18,20*(1-j*0.5),8*(1-j*0.5),0,0,6.28);ctx.fill(); ctx.translate(0,-j*60); ctx.scale(1-j*0.3, 1+j*0.5); let g=ctx.createRadialGradient(-5,-10,5,0,0,35);g.addColorStop(0,c);g.addColorStop(1,"rgba(0,0,0,0.4)");ctx.fillStyle=g; ctx.beginPath();ctx.moveTo(-15,12);ctx.quadraticCurveTo(-25,-20,0,-25);ctx.quadraticCurveTo(25,-20,15,12);ctx.quadraticCurveTo(0,25,-15,12);ctx.fill(); frog.blinkTimer--; if(frog.blinkTimer<-20)frog.blinkTimer=Math.random()*150+50; if(frog.blinkTimer>0){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-10,-18,7,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(10,-18,7,0,6.28);ctx.fill();ctx.fillStyle="#000";ctx.beginPath();ctx.arc(-10,-20,3,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(10,-20,3,0,6.28);ctx.fill();} if(j>0.2){ctx.strokeStyle=c;ctx.lineWidth=5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-12,8);ctx.quadraticCurveTo(-25,15,-28,-5);ctx.stroke();ctx.beginPath();ctx.moveTo(12,8);ctx.quadraticCurveTo(25,15,28,-5);ctx.stroke();} ctx.restore(); }
class Particle { constructor(x,y,c,t){this.x=x;this.y=y;this.c=c;this.t=t;this.l=1.0;let a=Math.random()*6.28;let s=Math.random()*3+1;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;if(t==='rain'){this.vx=-2;this.vy=15;}if(t==='snow'){this.vx=Math.sin(Math.random()*5);this.vy=3;}} update(){this.x+=this.vx;this.y+=this.vy;this.l-=0.03;} draw(ctx){ctx.save();ctx.globalAlpha=this.l;ctx.fillStyle=this.c;ctx.fillRect(this.x,this.y,this.t==='rain'?2:4,this.t==='rain'?15:4);ctx.restore();} }
function spawnParticles(x,y,c,n,t){for(let i=0;i<n;i++)particles.push(new Particle(x,y,c,t));}

// LOOP
function loop() {
    frame++; if(comboTimer>0)comboTimer--; if(shake>0)shake*=0.9; if(damageFlash>0)damageFlash--;
    if(comboPenalty>0) { comboPenalty--; document.getElementById('penalty-bar').style.width = (comboPenalty/300)*100 + "%"; if(comboPenalty<=0) document.getElementById('penalty-bar-container').style.display='none'; }
    if(state==='playing' && weather!=='clear') spawnParticles(Math.random()*width, frog.y-height/2-50, weather==='rain'?'#aaf':'#fff', 1, weather);

    if(state === 'playing') {
        if(Math.abs(frog.x - frog.tX) > 200) frog.x = frog.tX; else frog.x += (frog.tX - frog.x) * 0.3;
        frog.y += (frog.tY - frog.y) * 0.3; frog.jump *= 0.8; camY += (frog.y - height/2 - camY) * 0.05;
        let onLog = false;
        entities.forEach(e => {
            if(e.lane === frog.lane) {
                if(frog.x+15 < e.x+e.w && frog.x+35 > e.x && (e.t==='c'||e.t==='train')) endGame();
                if(e.t==='l' && frog.x+25>e.x && frog.x+25<e.x+e.w) { onLog = true; frog.tX+=e.s; frog.x+=e.s; }
            }
        });
        if(map[frog.lane].type==='water' && !onLog && frog.jump<0.2) { Sound.splash(); spawnParticles(frog.x+25,frog.y+25,"#0af",15,"splash"); endGame(); }
    }
    if(state !== 'dead') {
        map.forEach((l,i)=>{if(l.type==='rail'){if(l.railState==='dormant'&&Math.random()<0.005){l.railState='warning';l.warningTimer=120;}if(l.railState==='warning'){l.warningTimer--;if(l.warningTimer<=0){l.railState='active';entities.push({t:'train',lane:i,x:l.d===1?-2000:width+2000,w:1200,s:45*l.d});}}}});
        
        // --- JAVÍTOTT VÉGTELEN CIKLUS ÉS TISZTÍTÁS ---
        entities.forEach((e, index)=>{
            e.x+=e.s;
            // Vonat tisztítása (ha nagyon kiment, töröljük)
            if (e.t === 'train') {
                if (Math.abs(e.x) > 5000) entities.splice(index, 1);
            } 
            // Autók és Rönkök visszajönnek (Loop)
            else {
                if(e.s > 0 && e.x > width + 200) e.x = -300;
                if(e.s < 0 && e.x < -300) e.x = width + 200;
            }
        });
        
        staticCoins.forEach(c=>{if(c.active&&c.lane===frog.lane&&Math.abs(frog.x+25-c.x)<30){c.active=false;collectCoin(1,c.x,c.lane*laneH+50);}});
    }
    particles.forEach((p,i)=>{p.update();if(p.life<=0)particles.splice(i,1);});
    draw(); requestAnimationFrame(loop);
}

function draw() {
    ctx.clearRect(0,0,width,height); ctx.save();
    if(shake>0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    ctx.translate(0, -camY);
    map.forEach((l,i)=>{
        let y=i*laneH; if(y+laneH<camY||y>camY+height)return;
        if(l.type==='grass'||l.type==='start'){let g=ctx.createLinearGradient(0,y,0,y+laneH);g.addColorStop(0,"#120");g.addColorStop(1,"#240");ctx.fillStyle=g;ctx.fillRect(0,y,width,laneH);ctx.fillStyle="#360";for(let j=0;j<width;j+=20)ctx.fillRect(j+(l.seed*20),y+10,4,10+Math.sin(j)*5);}
        else if(l.type==='road'){ctx.fillStyle="#111";ctx.fillRect(0,y,width,laneH);ctx.fillStyle="#444";for(let j=0;j<width;j+=100)ctx.fillRect(j,y+45,60,10);}
        else if(l.type==='water'){let g=ctx.createLinearGradient(0,y,0,y+laneH);g.addColorStop(0,"#013");g.addColorStop(1,"#026");ctx.fillStyle=g;ctx.fillRect(0,y,width,laneH);ctx.fillStyle="rgba(0,242,255,0.1)";for(let w=0;w<width;w+=30)ctx.fillRect(w+Math.sin(frame*0.02+w)*20,y+10+Math.random()*80,20,5);}
        else if(l.type==='rail'){ctx.fillStyle="#211";ctx.fillRect(0,y,width,laneH);ctx.fillStyle="#543";for(let j=0;j<width;j+=50)ctx.fillRect(j,y+10,30,80);if(l.railState==='warning'||l.railState==='active'){ctx.fillStyle=(frame%10<5)?"#f00":"#500";ctx.beginPath();ctx.arc(60,y+50,25,0,6.28);ctx.fill();}}
        else if(l.type==='goal'){ctx.fillStyle="#042";ctx.fillRect(0,y,width,laneH);}
    });
    obstacles.forEach(o=>{let y=o.lane*laneH+(laneH-60)/2;if(o.type==='tree')drawTree(o.x,y);else drawRock(o.x,y);});
    entities.forEach(e=>{let y=e.lane*laneH+(laneH-55)/2; if(e.t==='train'){ctx.save();ctx.shadowColor="#000";ctx.shadowBlur=20;let g=ctx.createLinearGradient(e.x,y,e.x,y+70);g.addColorStop(0,"#444");g.addColorStop(1,"#111");ctx.fillStyle=g;ctx.fillRect(e.x,y,e.w,70);ctx.fillStyle="#000";ctx.fillRect(e.x,y+70,e.w,10);ctx.restore();} else if(e.t==='c')drawVehicle(e,y); else {let f=Math.sin(frame*0.05+e.x*0.01)*3;ctx.fillStyle="rgba(0,0,0,0.5)";ctx.beginPath();ctx.roundRect(e.x+10,y+25+f,e.w,30,15);ctx.fill();let g=ctx.createLinearGradient(e.x,y+f,e.x,y+55+f);g.addColorStop(0,"#3e2723");g.addColorStop(1,"#2d1e15");ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(e.x,y+10+f,e.w,35,10);ctx.fill();}});
    staticCoins.forEach(c=>{if(c.active){ctx.fillStyle="#ffd700";ctx.beginPath();ctx.arc(c.x,c.lane*laneH+50,8,0,6.28);ctx.fill();}});
    particles.forEach(p=>p.draw(ctx));
    drawFrog(frog.x,frog.y,frog.color,frog.jump);
    ctx.restore();
    if(damageFlash>0){ctx.fillStyle=`rgba(255,0,0,${damageFlash/30})`;ctx.fillRect(0,0,width,height);}
}

function renderShop() { const g=document.getElementById("skin-grid");g.innerHTML='';skins.forEach(s=>{const h=ownedSkins.includes(s.c),a=currentSkin===s.c,c=document.createElement('div');c.className=`skin-card ${a?'active':''}`;c.innerHTML=`<div class="skin-preview" style="background:${s.c}"></div><div style="font-weight:700;font-size:12px;">${s.name}</div><div class="${h?'skin-owned':'skin-price'}">${a?'KIVÁLASZTVA':(h?'MEGVÉVE':s.p+' $')}</div>`;c.onclick=()=>{if(h){currentSkin=s.c;updateTheme(s.c);}else if(totalCoins>=s.p){totalCoins-=s.p;ownedSkins.push(s.c);currentSkin=s.c;updateTheme(s.c);}save();renderShop();};g.appendChild(c);});}
function save() { localStorage.setItem('f_pro_lvl', level); localStorage.setItem('f_pro_coins', totalCoins); localStorage.setItem('f_pro_skins', JSON.stringify(ownedSkins)); localStorage.setItem('f_pro_curr', currentSkin); }
window.addEventListener('keydown', (e)=>{if(state==='playing'){const k=e.key.toLowerCase(); if(k==='w'||k==='arrowup')move('up'); if(k==='s'||k==='arrowdown')move('down'); if(k==='a'||k==='arrowleft')move('left'); if(k==='d'||k==='arrowright')move('right');}});
const sb=(id,d)=>{const el=document.getElementById(id);const t=(e)=>{e.preventDefault();move(d);};el.onmousedown=t;el.ontouchstart=t;}; sb('btn-up','up');sb('btn-down','down');sb('btn-left','left');sb('btn-right','right');
window.onresize=()=>{width=canvas.width=window.innerWidth;height=canvas.height=window.innerHeight;if(map.length===0)goToMenu();};
window.onresize(); goToMenu(); loop();
</script>
