<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profi Béka Kaland</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #hud { position: absolute; top: 10px; left: 10px; color: white; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; z-index: 10; }
        #ui { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); z-index: 100; }
        .btn { background: #2ecc71; color: white; border: none; padding: 20px 40px; font-size: 24px; border-radius: 10px; cursor: pointer; }
        #controls { position: absolute; bottom: 20px; right: 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; z-index: 10; }
        .c-btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid white; color: white; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 30px; }
    </style>
</head>
<body>

<div id="hud">SZINT: <span id="lvl">1</span></div>
<div id="ui"><button class="btn" onclick="start()">JÁTÉK INDÍTÁSA</button></div>

<div id="controls">
    <div style="grid-column: 2" class="c-btn" onclick="move('up')">▲</div>
    <div style="grid-column: 1" class="c-btn" onclick="move('left')">◀</div>
    <div style="grid-column: 2" class="c-btn" onclick="move('down')">▼</div>
    <div style="grid-column: 3" class="c-btn" onclick="move('right')">▶</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let w, h, laneH, level = 1, state = "menu";
let map = [], cars = [], logs = [], trains = [];
let frog = { lane: 0, x: 0, y: 0, size: 0 };

function initMap() {
    map = ['goal']; // Cél
    const options = ['grass', 'road', 'water', 'train', 'grass'];
    for(let i=0; i<8; i++) map.push(options[Math.floor(Math.random()*options.length)]);
    map.push('start'); // Start
    
    laneH = h / map.length;
    frog.lane = map.length - 1;
    frog.size = laneH * 0.8;
    frog.x = w/2 - frog.size/2;
    
    // Entitások
    cars = []; logs = []; trains = [];
    map.forEach((type, i) => {
        if(type === 'road') {
            for(let k=0; k<2; k++) cars.push({lane: i, x: Math.random()*w, speed: (2+Math.random()*level)* (Math.random()>0.5?1:-1), w: 100});
        }
        if(type === 'water') {
            for(let k=0; k<3; k++) logs.push({lane: i, x: Math.random()*w, speed: (1+Math.random()*level/2)* (Math.random()>0.5?1:-1), w: 150});
        }
        if(type === 'train') {
            trains.push({lane: i, x: -1000, active: false, timer: Math.random()*100});
        }
    });
}

function start() {
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w; canvas.height = h;
    document.getElementById("ui").style.display = "none";
    initMap();
    state = "playing";
}

function move(dir) {
    if(state !== "playing") return;
    if(dir === 'up' && frog.lane > 0) frog.lane--;
    if(dir === 'down' && frog.lane < map.length-1) frog.lane++;
    if(dir === 'left') frog.x -= 50;
    if(dir === 'right') frog.x += 50;
    
    if(frog.lane === 0) {
        level++;
        document.getElementById("lvl").innerText = level;
        initMap();
    }
}

function update() {
    if(state !== "playing") return;

    let onLog = false;
    let frogY = frog.lane * laneH + (laneH - frog.size)/2;
    frog.y = frogY;

    // Autók
    cars.forEach(c => {
        c.x += c.speed;
        if(c.x > w) c.x = -c.w; if(c.x < -c.w) c.x = w;
        if(frog.lane === c.lane && frog.x < c.x + c.w && frog.x + frog.size > c.x) start(); 
    });

    // Rönkök
    logs.forEach(l => {
        l.x += l.speed;
        if(l.x > w) l.x = -l.w; if(l.x < -l.w) l.x = w;
        if(frog.lane === l.lane && frog.x + frog.size/2 > l.x && frog.x + frog.size/2 < l.x + l.w) {
            onLog = true;
            frog.x += l.speed;
        }
    });

    if(map[frog.lane] === 'water' && !onLog) start();

    // Vonatok
    trains.forEach(t => {
        if(!t.active) {
            t.timer--;
            if(t.timer < 0) { t.active = true; t.x = -1500; }
        } else {
            t.x += 20 + level;
            if(t.x > w + 500) { t.active = false; t.timer = 100 + Math.random()*200; }
            if(frog.lane === t.lane && frog.x < t.x + 1000 && frog.x + frog.size > t.x) start();
        }
    });

    if(frog.x < 0 || frog.x > w) start();
}

function draw() {
    ctx.clearRect(0,0,w,h);
    
    map.forEach((type, i) => {
        let y = i * laneH;
        if(type === 'grass' || type === 'start') ctx.fillStyle = "#27ae60";
        else if(type === 'road') ctx.fillStyle = "#333";
        else if(type === 'water') ctx.fillStyle = "#2980b9";
        else if(type === 'train') ctx.fillStyle = "#555";
        else if(type === 'goal') ctx.fillStyle = "#f1c40f";
        ctx.fillRect(0, y, w, laneH);
        
        if(type === 'train') {
            ctx.fillStyle = "#222"; 
            ctx.fillRect(0, y+10, w, 5); ctx.fillRect(0, y+laneH-15, w, 5);
        }
    });

    logs.forEach(l => { ctx.fillStyle = "#7e522a"; ctx.fillRect(l.x, l.lane*laneH+5, l.w, laneH-10); });
    cars.forEach(c => { ctx.fillStyle = "#e74c3c"; ctx.fillRect(c.x, c.lane*laneH+5, c.w, laneH-10); });
    trains.forEach(t => { if(t.active) { ctx.fillStyle = "#8e44ad"; ctx.fillRect(t.x, t.lane*laneH+5, 1000, laneH-10); }});

    // BÉKA (Extra látható!)
    ctx.shadowBlur = 15; ctx.shadowColor = "#00ff00";
    ctx.fillStyle = "#2ecc71";
    ctx.strokeStyle = "white"; ctx.lineWidth = 3;
    ctx.fillRect(frog.x, frog.y, frog.size, frog.size);
    ctx.strokeRect(frog.x, frog.y, frog.size, frog.size);
    ctx.shadowBlur = 0;

    update();
    requestAnimationFrame(draw);
}

window.addEventListener("keydown", e => {
    if(e.key === "ArrowUp") move('up'); if(e.key === "ArrowDown") move('down');
    if(e.key === "ArrowLeft") move('left'); if(e.key === "ArrowRight") move('right');
});

draw();
</script>
</body>
</html>
