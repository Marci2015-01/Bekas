<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Végtelen Béka - ULTIMATE PRO (Wrap Penalty)</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
<style>
    :root { --accent: #00f2ff; --warn: #ff0055; --bg: #050505; }
    html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        overflow: hidden; background: var(--bg);
        font-family: 'Rajdhani', sans-serif;
        touch-action: none; user-select: none;
    }
    canvas { display: block; }
    
    #hud {
        position: absolute; top: 20px; left: 20px; right: 20px;
        display: flex; justify-content: space-between;
        color: white; z-index: 100; pointer-events: none;
        text-transform: uppercase;
    }
    .hud-box {
        background: rgba(0, 0, 0, 0.7);
        border-left: 4px solid var(--accent);
        padding: 10px 25px;
        backdrop-filter: blur(5px);
        transform: skewX(-15deg);
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .hud-label { font-size: 12px; opacity: 0.8; font-weight: 700; transform: skewX(15deg); display:block; letter-spacing: 2px; }
    .stat-val { color: #fff; font-weight: 900; font-size: 28px; transform: skewX(15deg); display: block; text-shadow: 0 0 10px var(--accent); }
    #coin-val { color: #ffd700; text-shadow: 0 0 10px #ffd700; }

    /* PENALTY BAR */
    #penalty-bar-container {
        position: absolute; top: 80px; left: 50%; transform: translateX(-50%) skewX(-15deg);
        width: 200px; height: 8px; background: rgba(255, 255, 255, 0.1);
        display: none; /* Alapból rejtett */
        border: 1px solid rgba(255,0,0,0.3);
    }
    #penalty-bar {
        width: 100%; height: 100%; background: var(--warn);
        box-shadow: 0 0 15px var(--warn);
        transition: width 0.1s linear;
    }
    #penalty-text {
        position: absolute; top: -20px; width: 100%; text-align: center;
        color: var(--warn); font-size: 12px; font-weight: 900; letter-spacing: 2px;
    }

    #ui-layer {
        position: absolute; inset: 0;
        display: flex; justify-content: center; align-items: center;
        z-index: 200; 
        background: rgba(0,0,0,0.85); 
        backdrop-filter: blur(10px);
    }
    
    .panel {
        background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
        border: 1px solid rgba(255,255,255,0.1);
        border-top: 4px solid var(--accent);
        color: white; padding: 40px; 
        width: 85%; max-width: 450px;
        box-shadow: 0 0 50px rgba(0, 242, 255, 0.15);
        transform: skewX(-5deg);
    }
    
    .panel-content { transform: skewX(5deg); text-align: center; }

    h1 {
        font-size: 52px; margin: 0; line-height: 1;
        background: linear-gradient(to right, #fff, #999);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .weather-badge {
        background: #fff; color: #000; padding: 2px 8px; font-weight: 900; font-size: 14px;
        position: absolute; top: -15px; right: -15px; transform: rotate(10deg);
        box-shadow: 0 0 15px #fff;
    }
    
    .big-btn {
        background: transparent; color: var(--accent); 
        border: 2px solid var(--accent); padding: 15px; margin: 15px 0;
        font-size: 20px; cursor: pointer; width: 100%; 
        font-weight: 900; text-transform: uppercase; letter-spacing: 2px; transition: 0.2s;
        font-family: 'Rajdhani', sans-serif;
    }
    .big-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 30px var(--accent); }
    .big-btn:active { transform: scale(0.98); }

    .skin-card {
        background: rgba(255,255,255,0.05);
        padding: 10px; cursor: pointer; transition: 0.3s;
        border: 1px solid rgba(255,255,255,0.1);
        display: flex; flex-direction: column; align-items: center;
    }
    .skin-card.active { border-color: var(--accent); background: rgba(0, 242, 255, 0.1); box-shadow: inset 0 0 20px rgba(0, 242, 255, 0.1); }
    
    .skin-preview { width: 40px; height: 40px; border-radius: 50%; margin-bottom: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

    #controls {
        position: absolute; bottom: 30px; right: 30px;
        display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; z-index: 150;
    }
    .ctrl-btn {
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        color: var(--accent); height: 80px; display: flex; 
        justify-content: center; align-items: center; font-size: 24px; backdrop-filter: blur(5px);
        transform: skewX(-10deg); transition: 0.1s;
    }
    .ctrl-btn:active { background: var(--accent); color: #000; }
</style>
</head>
<body>

<div id="hud">
    <div class="hud-box">
        <span class="hud-label">SZINT</span>
        <span id="lvl-num" class="stat-val">1</span>
    </div>
    <div id="penalty-bar-container">
        <div id="penalty-text">LOCKED</div>
        <div id="penalty-bar"></div>
    </div>
    
    <div class="hud-box" style="border-left:none; border-right:4px solid #ffd700; text-align:right;">
        <span class="hud-label">VAGYON</span>
        <span id="coin-num" class="stat-val" style="color:#ffd700; text-shadow:0 0 10px #ffd700">0</span>
    </div>
</div>

<div id="ui-layer">
    <div id="msg-box" class="panel">
        <div class="panel-content">
            <div style="position:relative; display:inline-block; margin-bottom: 20px;">
                <h1>FROGGER</h1>
                <div class="weather-badge">PRO</div>
            </div>
            <p style="color:#888; margin-bottom:30px; font-size: 16px; font-weight:700;">
                HÓ • FÁK • WRAP PENALTY
            </p>
            <div style="text-align:left; font-size:14px; color:#ccc; margin-bottom:20px; line-height:1.6; border-top:1px solid #333; padding-top:15px;">
                ⚠️ <b>WRAP:</b> Ha kimész a szélén, 5 mp büntetés!<br>
                🚂 <b>VONAT:</b> Ha rázkódik a kép, FUSS!<br>
                🌲 <b>AKADÁLYOK:</b> Kerüld ki a köveket és a fákat!
            </div>
            <button class="big-btn" id="start-btn">START GAME</button>
            <button class="big-btn" id="open-shop-btn" style="border-color:#555; color:#aaa; font-size:16px;">GARÁZS</button>
        </div>
    </div>
    
    <div id="shop-box" class="panel" style="display:none">
        <div class="panel-content">
            <h2 style="margin:0 0 20px 0;">GARÁZS</h2>
            <div id="skin-grid" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:20px;"></div>
            <button class="big-btn" id="close-shop-btn">VISSZA</button>
        </div>
    </div>
</div>

<div id="controls">
    <div class="ctrl-btn" id="btn-up" style="grid-column:2">▲</div>
    <div class="ctrl-btn" id="btn-left" style="grid-column:1; grid-row:2">◀</div>
    <div class="ctrl-btn" id="btn-down" style="grid-column:2; grid-row:2">▼</div>
    <div class="ctrl-btn" id="btn-right" style="grid-column:3; grid-row:2">▶</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// --- PRO AUDIO MOTOR ---
const Sound = {
    ctx: null,
    init: function() {
        if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
        if (this.ctx.state === 'suspended') { this.ctx.resume(); }
    },
    playTone: function(freq, type, duration, vol=0.1, slide=0) {
        if(!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if(slide !== 0) osc.frequency.linearRampToValueAtTime(freq + slide, this.ctx.currentTime + duration);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
    },
    jump: function() { this.playTone(200, 'triangle', 0.1, 0.1, 100); }, 
    coin: function() { this.playTone(1500, 'sine', 0.1, 0.1); setTimeout(()=>this.playTone(2500, 'sine', 0.2, 0.1), 50); },
    combo: function(count) { let pitch = 400 + (count * 100); this.playTone(pitch, 'square', 0.1, 0.1); },
    lock: function() { this.playTone(100, 'sawtooth', 0.2, 0.2, -20); }, // Büntető hang
    splash: function() {
        if(!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 0.5; const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
        const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 600;
        noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination); noise.start();
    },
    crash: function() { this.playTone(100, 'sawtooth', 0.5, 0.4, -50); },
    win: function() { this.playTone(400, 'triangle', 0.1); setTimeout(()=>this.playTone(600, 'triangle', 0.1), 100); setTimeout(()=>this.playTone(800, 'triangle', 0.3, 0.2), 200); },
    crossingBell: function() { this.playTone(800, 'square', 0.05, 0.05); },
    trainRoar: function() {
         if(!this.ctx) return;
         const bufferSize = this.ctx.sampleRate * 2.0; const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
         const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
         const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
         const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
         gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 2.0);
         const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 100; 
         noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination); noise.start();
    }
};

// --- CONFIG ---
let level = parseInt(localStorage.getItem('f_pro_lvl')) || 1;
let totalCoins = parseInt(localStorage.getItem('f_pro_coins')) || 0;
let ownedSkins = JSON.parse(localStorage.getItem('f_pro_skins')) || ['#2ecc71'];
let currentSkin = localStorage.getItem('f_pro_curr') || '#2ecc71';

const skins = [
    { name: 'NEON',   c: '#2ecc71', p: 0 },
    { name: 'AQUA',   c: '#3498db', p: 50 },
    { name: 'DIRT',   c: '#795548', p: 50 },
    { name: 'MAGMA',  c: '#e74c3c', p: 150 },
    { name: 'TOXIC',  c: '#9b59b6', p: 150 },
    { name: 'ICE',    c: '#00d2ff', p: 300 },
    { name: 'STEALTH',c: '#333333', p: 500 },
    { name: 'GOLD',   c: '#ffd700', p: 1000 },
    { name: 'DIAMOND',c: '#b9f2ff', p: 2000 }
];

document.getElementById('lvl-num').innerText = level;
document.getElementById('coin-num').innerText = totalCoins;

let width, height, laneH = 100, state = "menu";
let map = [], entities = [], staticCoins = [], obstacles = [], particles = [], floatingTexts = [];
let frame = 0, startT = 0;
let frog = { x:0, y:0, tX:0, tY:0, lane:0, jump:0, color: currentSkin, blinkTimer: 0, rot: 0 };
let camY = 0;
let shake = 0; 
let combo = 0; let comboTimer = 0;
let comboPenalty = 0; // BÜNTETÉS SZÁMLÁLÓ
let weather = 'clear'; 

// --- EFX RENDSZER ---
class Particle {
    constructor(x, y, color, type) {
        this.x = x; this.y = y; this.color = color; this.type = type; this.life = 1.0;
        let angle = Math.random() * Math.PI * 2; let speed = Math.random() * 3 + 1;
        this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
        if(type === 'smoke') { this.vy = -1 - Math.random(); this.vx *= 0.5; }
        if(type === 'rain') { this.vx = -2; this.vy = 15 + Math.random()*5; this.life = 1; }
        if(type === 'snow') { this.vx = Math.sin(Math.random()*10); this.vy = 2 + Math.random(); this.life = 1; } 
    }
    update() {
        this.x += this.vx; this.y += this.vy; 
        if(this.type === 'snow') this.x += Math.sin(frame*0.05 + this.y*0.01) * 0.5; 
        
        if(this.type !== 'rain' && this.type !== 'snow') this.life -= 0.03;
        if(this.type === 'smoke') { this.vx *= 0.95; this.life -= 0.01; } 
        if(this.type === 'rain' || this.type === 'snow') { if(this.y > frog.y + height/2) this.life = 0; } 
    }
    draw(ctx) {
        ctx.save(); ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
        if(this.type === 'sparkle') { ctx.shadowColor = this.color; ctx.shadowBlur = 10; ctx.fillRect(this.x, this.y, 4, 4); } 
        else if(this.type === 'smoke') { ctx.beginPath(); ctx.arc(this.x, this.y, 8 * (2-this.life), 0, Math.PI*2); ctx.fill(); } 
        else if(this.type === 'rain') { ctx.fillStyle = "rgba(180, 220, 255, 0.4)"; ctx.fillRect(this.x, this.y, 2, 15); }
        else if(this.type === 'snow') { ctx.fillStyle = "rgba(255, 255, 255, 0.9)"; ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2); ctx.fill(); }
        else { ctx.fillRect(this.x, this.y, 4, 4); }
        ctx.restore();
    }
}

class FloatingText {
    constructor(text, x, y, color) { this.text = text; this.x = x; this.y = y; this.color = color; this.life = 1.0; this.vy = -2; }
    update() { this.y += this.vy; this.life -= 0.02; }
    draw(ctx) {
        ctx.save(); ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color; ctx.font = "900 24px 'Rajdhani'"; 
        ctx.shadowColor = this.color; ctx.shadowBlur = 10; ctx.textAlign = "center";
        ctx.fillText(this.text, this.x, this.y); ctx.restore();
    }
}

function spawnParticles(x, y, color, count, type) { for(let i=0; i<count; i++) particles.push(new Particle(x, y, color, type)); }
function showText(text, x, y, color="#fff") { floatingTexts.push(new FloatingText(text, x, y, color)); }

// --- RAJZOLÓK ---
function drawRock(x, y) {
    ctx.save(); ctx.translate(x + 25, y + 30); 
    ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 15;
    let g = ctx.createLinearGradient(-15, -15, 10, 10); g.addColorStop(0, "#555"); g.addColorStop(1, "#222"); ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(-20, 15); ctx.lineTo(-15, -15); ctx.lineTo(15, -20); ctx.lineTo(25, 10); ctx.lineTo(15, 20); ctx.lineTo(-15, 25); ctx.fill();
    ctx.fillStyle = "rgba(46, 204, 113, 0.2)"; ctx.beginPath(); ctx.arc(-5, -5, 12, 0, Math.PI*2); ctx.fill(); 
    if(weather === 'snow') { ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.beginPath(); ctx.ellipse(0, -18, 15, 5, 0, 0, Math.PI*2); ctx.fill(); } 
    ctx.restore();
}

function drawTree(x, y) {
    ctx.save(); ctx.translate(x + 25, y + 40);
    ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 15;
    ctx.fillStyle = "#3e2723"; ctx.fillRect(-5, 0, 10, 20);
    let treeColor = "#145a32"; if(weather === 'snow') treeColor = "#3a7a52"; 
    ctx.fillStyle = treeColor;
    ctx.beginPath(); ctx.moveTo(-25, 0); ctx.lineTo(25, 0); ctx.lineTo(0, -35); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-20, -20); ctx.lineTo(20, -20); ctx.lineTo(0, -50); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-15, -40); ctx.lineTo(15, -40); ctx.lineTo(0, -65); ctx.fill();
    if(weather === 'snow') {
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath(); ctx.moveTo(-25, 0); ctx.lineTo(25, 0); ctx.lineTo(0, -10); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-20, -20); ctx.lineTo(20, -20); ctx.lineTo(0, -30); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-15, -40); ctx.lineTo(15, -40); ctx.lineTo(0, -50); ctx.fill();
    }
    ctx.restore();
}

function drawCoin(x, y) {
    let floatY = Math.sin(frame * 0.15) * 4; 
    let w = 15 * Math.abs(Math.sin(frame * 0.05)); 
    ctx.save(); ctx.translate(x, y + 25 + floatY); 
    ctx.shadowColor = "#ffd700"; ctx.shadowBlur = 25;
    ctx.fillStyle = "#ffaa00"; ctx.beginPath(); ctx.ellipse(0, 0, w, 16, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ffe600"; ctx.beginPath(); ctx.ellipse(0, -2, w*0.8, 14, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff"; if (w > 5) { ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.ellipse(-w*0.3, -5, w*0.2, 4, 0, 0, Math.PI*2); ctx.fill(); } ctx.restore();
}

function drawExhaustPipe(x, y) {
    let floatY = Math.sin(frame * 0.1) * 2;
    ctx.save(); ctx.translate(x, y + 35 + floatY); ctx.rotate(Math.sin(frame * 0.05) * 0.1); 
    ctx.shadowColor = "#000"; ctx.shadowBlur = 10;
    let grad = ctx.createLinearGradient(-15, -5, 15, 5); grad.addColorStop(0, "#5a4a42"); grad.addColorStop(0.5, "#999"); grad.addColorStop(1, "#3e2723"); ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(18, -9); ctx.lineTo(22, 6); ctx.lineTo(-15, 9); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.ellipse(20, -1, 5, 8, 0, 0, Math.PI*2); ctx.fill();
    if(frame % 10 === 0) spawnParticles(x+20, y+35, "rgba(50,50,50,0.5)", 1, "smoke"); ctx.restore();
}

function drawTrain(e, y) {
    const isRight = e.s > 0;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 20;
    let segments = 6; let segmentW = e.w / segments; let trainY = y - 5; 
    if(state === 'playing') {
        trainY += (Math.random() - 0.5) * 2;
        if(e.x > -1000 && e.x < width + 1000) shake = 3;
    }
    for(let i=0; i<segments; i++) {
        let segX = isRight ? e.x + i*segmentW : e.x + e.w - (i+1)*segmentW;
        let isEngine = i === 0;
        let trainBody = ctx.createLinearGradient(segX, trainY, segX, trainY+70);
        trainBody.addColorStop(0, isEngine ? "#555" : "#666"); trainBody.addColorStop(0.5, isEngine ? "#333" : "#444"); trainBody.addColorStop(1, "#111");
        ctx.fillStyle = trainBody;
        ctx.beginPath();
        if(isEngine && isRight) ctx.roundRect(segX, trainY+10, segmentW-2, 80, [5, 20, 5, 5]);
        else if(isEngine && !isRight) ctx.roundRect(segX, trainY+10, segmentW-2, 80, [20, 5, 5, 5]);
        else ctx.roundRect(segX+2, trainY+10, segmentW-4, 80, 3);
        ctx.fill();
        ctx.fillStyle = "#000"; ctx.fillRect(segX, trainY+80, segmentW, 10); 
        ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(segX+15, trainY+90, 10, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(segX+segmentW-15, trainY+90, 10, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#444"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(segX+15, trainY+90); ctx.lineTo(segX+segmentW-15, trainY+90); ctx.stroke();
        ctx.fillStyle = isEngine ? "#00f2ff" : "#111"; 
        if(isEngine) { ctx.shadowColor = "#00f2ff"; ctx.shadowBlur = 10; ctx.fillRect(segX + (isRight?segmentW-30:15), trainY+20, 20, 20); ctx.shadowBlur = 0; } 
        else { ctx.fillRect(segX + 20, trainY+25, segmentW-40, 15); }
        if(isEngine && state === 'playing') {
             let smokeX = isRight ? segX+segmentW-20 : segX+20;
             if(frame%3===0) spawnParticles(smokeX, trainY+10, "rgba(50,50,50,0.6)", 2, "smoke");
             if(Math.random() > 0.8) spawnParticles(segX + Math.random()*segmentW, trainY+90, "#ffaa00", 1, "sparkle");
        }
    }
    ctx.restore();
}

function drawFrog(x, y, color, jump) {
    ctx.save(); ctx.translate(x + 25, y + 25);
    if(jump > 0.1) ctx.rotate(frog.rot * 0.15);
    ctx.fillStyle = "rgba(0,0,0,0.6)"; let shadowScale = 1 - (jump * 0.7); ctx.beginPath(); ctx.ellipse(0, 20, 22 * shadowScale, 10 * shadowScale, 0, 0, Math.PI*2); ctx.fill();
    ctx.translate(0, -jump * 70); let stretch = 1 + (jump * 0.4); let squash = 1 - (jump * 0.2); if(jump < 0.1 && jump > 0) { squash = 1.3; stretch = 0.7; } ctx.scale(squash, stretch);
    let grad = ctx.createRadialGradient(-5, -10, 5, 0, 0, 35); grad.addColorStop(0, color); 
    if(color === '#ffd700') { grad.addColorStop(1, "#b8860b"); ctx.shadowColor="#ffd700"; ctx.shadowBlur=20; } else if(color === '#00f2ff') { grad.addColorStop(1, "#00bcd4"); ctx.shadowColor="#00bcd4"; ctx.shadowBlur=20; } else { grad.addColorStop(1, "rgba(0,0,0,0.3)"); } ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(-18, 15); ctx.quadraticCurveTo(-30, -25, 0, -28); ctx.quadraticCurveTo(30, -25, 18, 15); ctx.quadraticCurveTo(0, 28, -18, 15); ctx.fill();
    frog.blinkTimer--; if(frog.blinkTimer < -10) frog.blinkTimer = Math.random() * 200 + 50; let eyesOpen = frog.blinkTimer > 0;
    if(eyesOpen) { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-12, -20, 8, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(12, -20, 8, 0, 7); ctx.fill(); ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(-12, -22, 3.5, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(12, -22, 3.5, 0, 7); ctx.fill(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-10, -24, 1.5, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(14, -24, 1.5, 0, 7); ctx.fill(); } 
    else { ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-18, -20); ctx.lineTo(-6, -20); ctx.stroke(); ctx.beginPath(); ctx.moveTo(6, -20); ctx.lineTo(18, -20); ctx.stroke(); }
    if(jump > 0.1) { ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-15, 10); ctx.quadraticCurveTo(-25, 20, -30, 0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(15, 10); ctx.quadraticCurveTo(25, 20, 30, 0); ctx.stroke(); } ctx.restore();
}

function drawVehicle(e, y) {
    const isRight = e.s > 0; const isTrabant = e.t === 'trabant'; const isSport = e.subtype === 'sport'; const isTruck = e.subtype === 'truck';
    ctx.save();
    if(isRight) { 
        let beam = ctx.createLinearGradient(e.x+e.w, y+25, e.x+e.w+350, y+25); beam.addColorStop(0, "rgba(255,255,220,0.8)"); beam.addColorStop(1, "rgba(255,255,220,0)");
        ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(e.x+e.w, y+10); ctx.lineTo(e.x+e.w+350, y-30); ctx.lineTo(e.x+e.w+350, y+80); ctx.lineTo(e.x+e.w, y+40); ctx.fill();
    } else { 
        let beam = ctx.createLinearGradient(e.x, y+25, e.x-350, y+25); beam.addColorStop(0, "rgba(255,255,220,0.8)"); beam.addColorStop(1, "rgba(255,255,220,0)");
        ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(e.x, y+10); ctx.lineTo(e.x-350, y-30); ctx.lineTo(e.x-350, y+80); ctx.lineTo(e.x, y+40); ctx.fill();
    }
    if(isTrabant && state === 'playing') { let smokeX = isRight ? e.x : e.x + e.w; spawnParticles(smokeX + (isRight?-10:10), y+40, `rgba(180,180,180,0.4)`, 2, 'smoke'); }
    ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.beginPath(); ctx.roundRect(e.x+5, y+45, e.w-10, 15, 5); ctx.fill();
    let carBody = ctx.createLinearGradient(e.x, y, e.x, y+50); carBody.addColorStop(0, e.col); carBody.addColorStop(1, "#050505"); ctx.fillStyle = carBody;
    if(isTruck) { ctx.fillRect(e.x, y-10, e.w, 60); ctx.fillStyle = "#333"; ctx.fillRect(e.x, y-10, e.w, 20); } 
    else if(isSport) { ctx.beginPath(); if(isRight) { ctx.moveTo(e.x, y+15); ctx.lineTo(e.x+30, y+5); ctx.lineTo(e.x+e.w-10, y+10); ctx.lineTo(e.x+e.w, y+25); ctx.lineTo(e.x+e.w, y+50); ctx.lineTo(e.x, y+50); } else { ctx.moveTo(e.x+e.w, y+15); ctx.lineTo(e.x+e.w-30, y+5); ctx.lineTo(e.x+10, y+10); ctx.lineTo(e.x, y+25); ctx.lineTo(e.x, y+50); ctx.lineTo(e.x+e.w, y+50); } ctx.fill(); ctx.fillStyle = "#111"; if(isRight) ctx.fillRect(e.x, y, 10, 20); else ctx.fillRect(e.x+e.w-10, y, 10, 20); } 
    else { ctx.beginPath(); ctx.roundRect(e.x, y+5, e.w, 45, 8); ctx.fill(); let cabinMargin = isTrabant ? 10 : 25; ctx.fillStyle = "#222"; ctx.beginPath(); ctx.roundRect(e.x + cabinMargin, y, e.w - cabinMargin*2, 40, 5); ctx.fill(); let glassGrad = ctx.createLinearGradient(0, y, 0, y+30); glassGrad.addColorStop(0, "#00f2ff"); glassGrad.addColorStop(1, "#0055ff"); ctx.fillStyle = glassGrad; ctx.beginPath(); ctx.roundRect(e.x + cabinMargin + 5, y+5, e.w - cabinMargin*2 - 10, 25, 3); ctx.fill(); }
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.roundRect(e.x+15, y+40, 12, 12, 3); ctx.fill(); ctx.beginPath(); ctx.roundRect(e.x+e.w-27, y+40, 12, 12, 3); ctx.fill(); ctx.restore();
}
function drawLog(e, y) {
    let bob = Math.sin(frame * 0.05 + e.x*0.01) * 3; y += bob;
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.roundRect(e.x+10, y+25, e.w, 30, 15); ctx.fill();
    let g = ctx.createLinearGradient(e.x, y, e.x, y+55); g.addColorStop(0, "#3e2723"); g.addColorStop(0.5, "#5d4037"); g.addColorStop(1, "#2d1e15"); ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(e.x, y+10, e.w, 35, 10); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(e.x+10, y+27, 3, 8, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(e.x+e.w-10, y+27, 3, 8, 0, 0, Math.PI*2); ctx.fill(); ctx.fillRect(e.x+30, y+20, e.w-60, 2);
    if(e.hasCoin) drawCoin(e.x + e.w/2, y-bob);
}

// --- LOGIKA ---
function generateMap() {
    map = [{type:'goal'}];
    let len = 15 + Math.min(level, 40);
    for(let i=1; i<len-1; i++) {
        let r = Math.random();
        let type = r < 0.1 ? 'rail' : (r < 0.3 ? 'grass' : (r < 0.6 ? 'water' : 'road'));
        let baseSpeed = 1.5 + (level * 0.15); 
        let speedVariance = Math.random() * 3.5;
        let finalSpeed = baseSpeed + speedVariance;
        map.push({type, d:Math.random()>0.5?1:-1, s:finalSpeed, seed: Math.random(), railState: 'dormant', warningTimer: 0});
    }
    map.push({type:'start'});

    entities = []; staticCoins = []; obstacles = [];
    let spawnW = width > 0 ? width : window.innerWidth;

    map.forEach((l, i) => {
        if(l.type==='road' || l.type==='water') {
            let count = 2 + Math.floor(Math.random() * 2); let spacing = spawnW / count;
            for(let k=0; k<count; k++) {
                let offset = (Math.random() * 200) - 100; 
                let subtype = 'sedan'; let vehicleWidth = 140; let vehicleColor = `hsl(${Math.random()*360}, 70%, 50%)`;
                if(l.type === 'road') {
                    let rnd = Math.random();
                    if(rnd > 0.7) { subtype = 'sport'; vehicleWidth = 130; vehicleColor = '#e74c3c'; l.s *= 1.2; }
                    else if(rnd < 0.2) { subtype = 'truck'; vehicleWidth = 180; vehicleColor = '#555'; l.s *= 0.8; }
                }
                entities.push({
                    t:l.type==='road'?'c':'l', subtype: subtype, lane:i, x: (k * spacing) + offset, w:l.type==='road'?vehicleWidth:220, s:l.s*l.d, 
                    col: l.t==='c' ? vehicleColor : '#3d2b1f', hasCoin: l.type==='water' && Math.random() > 0.4
                });
            }
        }
        if(l.type === 'grass' || l.type === 'road') { if(Math.random() > 0.3) staticCoins.push({ lane: i, x: Math.random() * (spawnW - 50) + 25, active: true, type: 'coin' }); }
        
        // AKADÁLYOK (KŐ VAGY FA)
        if(l.type === 'grass') { 
            let obsCount = Math.floor(Math.random() * 3); 
            for(let r=0; r<obsCount; r++) { 
                let type = Math.random() > 0.5 ? 'rock' : 'tree';
                obstacles.push({ lane: i, x: Math.random() * (spawnW - 50) + 25, type: type }); 
            }
        }
    });

    if(level % 4 === 0) {
        let roadIndices = []; map.forEach((l, i) => { if(l.type==='road') roadIndices.push(i); });
        if(roadIndices.length > 0) {
            let trabiLane = roadIndices[Math.floor(Math.random() * roadIndices.length)]; let direction = map[trabiLane].d; 
            entities.push({ t: 'trabant', lane: trabiLane, x: direction === 1 ? -1000 : spawnW + 1000, w: 135, s: 35 * direction, col: '#B5C2B7', droppedExhaust: false });
        }
    }

    let wRand = Math.random();
    if(wRand < 0.33) weather = 'rain'; else if(wRand < 0.66) weather = 'snow'; else weather = 'clear';
}

function start() {
    state = "playing"; generateMap(); 
    frog.lane = map.length - 1; frog.tX = width/2 - 25; frog.tY = frog.lane * laneH + (laneH-55)/2; frog.x = frog.tX; frog.y = frog.tY; camY = frog.y - height/2;
    document.getElementById('ui-layer').style.display = "none"; document.getElementById('lvl-num').innerText = level; document.getElementById('coin-num').innerText = totalCoins;
    startT = Date.now(); particles = []; floatingTexts = []; combo=0; shake=0; comboPenalty=0;
    document.getElementById('penalty-bar-container').style.display = 'none';
}

function move(d) {
    if(state !== "playing") return;
    let targetLane = frog.lane; let targetX = frog.tX;
    if(d==='up') targetLane--; else if(d==='down') targetLane++; else if(d==='left') targetX -= 85; else if(d==='right') targetX += 85;
    if(targetLane < 0 || targetLane >= map.length) return;
    
    // --- WRAP LOGIC & PENALTY ---
    let wrapped = false;
    if(targetX < -50) { targetX += width; wrapped = true; }
    if(targetX > width) { targetX -= width; wrapped = true; }
    
    if(wrapped) {
        combo = 0; comboPenalty = 300; // 5mp (60fps * 5)
        Sound.lock();
        document.getElementById('penalty-bar-container').style.display = 'block';
    }

    let hitObs = false; obstacles.forEach(o => { if(o.lane === targetLane) { if(Math.abs((targetX + 25) - (o.x + 25)) < 40) hitObs = true; }});
    if(hitObs) { Sound.playTone(100, 'square', 0.1); return; }

    Sound.jump();
    if(map[frog.lane].type === 'grass' || map[frog.lane].type === 'start') { spawnParticles(frog.x + 25, frog.y + 50, "#3a5f0b", 5, "smoke"); }
    frog.jump = 1; frog.lane = targetLane; frog.tX = targetX;
    if(d==='left') frog.rot = -1; else if(d==='right') frog.rot = 1; else frog.rot = 0;
    frog.tY = frog.lane * laneH + (laneH-55)/2;
    
    // COMBO CSAK HA NINCS BÜNTETÉS
    if(d === 'up') {
        if(comboPenalty <= 0) {
            if(comboTimer > 0) {
                combo++;
                if(combo > 1) { 
                    showText(`${combo}x COMBO!`, frog.x+25, frog.y, "#00f2ff"); 
                    Sound.combo(combo); 
                    totalCoins += combo; 
                    document.getElementById('coin-num').innerText = totalCoins;
                }
            } else { combo = 1; }
            comboTimer = 60;
        }
    }

    if(frog.lane === 0) {
        state = "menu"; level++; totalCoins += 100; save(); Sound.win();
        document.getElementById('lvl-num').innerText = level; document.getElementById('coin-num').innerText = totalCoins;
        document.getElementById('ui-layer').style.display = "flex"; document.getElementById('msg-title').innerText = "KÜLDETÉS TELJESÍTVE";
        spawnParticles(width/2, height/2, "#ffd700", 50, "sparkle");
    }
}

function collectCoin(amount = 1, x, y) { totalCoins += amount; Sound.coin(); document.getElementById('coin-num').innerText = totalCoins; spawnParticles(x, y, "#ffd700", 10, "sparkle"); }

function loop() {
    frame++; if(comboTimer > 0) comboTimer--; if(shake > 0) shake *= 0.9;
    
    // PENALTY COUNTDOWN
    if(comboPenalty > 0) {
        comboPenalty--;
        document.getElementById('penalty-bar').style.width = (comboPenalty/300)*100 + "%";
        if(comboPenalty <= 0) document.getElementById('penalty-bar-container').style.display = 'none';
    }

    if(state === 'playing') {
        if(weather === 'rain') spawnParticles(Math.random()*width, frog.y - height/2 - 50, "#aaf", 3, "rain");
        if(weather === 'snow') spawnParticles(Math.random()*width, frog.y - height/2 - 50, "#fff", 1, "snow");
    }

    if(state !== "dead") {
        map.forEach((l, i) => {
            if(l.type === 'rail') {
                if(l.railState === 'dormant' && Math.random() < 0.005) { l.railState = 'warning'; l.warningTimer = 120; }
                if(l.railState === 'warning') {
                    l.warningTimer--; if(frame % 30 === 0) Sound.crossingBell();
                    if(l.warningTimer <= 0) { l.railState = 'active'; Sound.trainRoar(); entities.push({ t: 'train', lane: i, x: l.d === 1 ? -2000 : width + 2000, w: 1200, s: 45 * l.d }); }
                }
            }
        });

        entities.forEach((e, index) => {
             let px = e.x; e.x += e.s;
             if(e.t === 'trabant' && !e.droppedExhaust) {
                 if ((e.s > 0 && e.x > width/2) || (e.s < 0 && e.x + e.w < width/2)) {
                     staticCoins.push({ lane: e.lane, x: e.x + (e.w/2), active: true, type: 'exhaust' });
                     e.droppedExhaust = true; spawnParticles(e.x+e.w/2, e.lane*laneH+50, "#555", 10, "smoke"); Sound.playTone(150, 'sawtooth', 0.2);
                 }
             } else if(e.t === 'train') {
                 if(e.x > width + 2500 || e.x < -2500) { map[e.lane].railState = 'dormant'; entities.splice(index, 1); return; }
             } else { if(e.x > width) e.x = -e.w; if(e.x < -e.w) e.x = width; }
             
             if(state === "playing") {
                if(e.t === 'l' && e.lane === frog.lane) {
                    if(frog.x + 25 > e.x && frog.x + 25 < e.x + e.w) {
                        frog.tX += e.s; if(Math.abs(e.x - px) > 100) { let d = e.x - px; frog.tX += d; frog.x += d; }
                        if(e.hasCoin) { let coinX = e.x + e.w/2; if(Math.abs((frog.x + 25) - coinX) < 40) { e.hasCoin = false; collectCoin(1, coinX, e.lane*laneH+50); }}
                    }
                }
                if((e.t === 'c' || e.t === 'trabant' || e.t === 'train') && e.lane === frog.lane && frog.x + 15 < e.x + e.w && frog.x + 35 > e.x) endGame();
             }
        });
    }

    if(state === "playing") {
        let onLog = false; entities.forEach(e => { if(e.t === 'l' && e.lane === frog.lane && frog.x + 25 > e.x && frog.x + 25 < e.x + e.w) onLog = true; });
        staticCoins.forEach(c => { if(c.active && c.lane === frog.lane) { if(Math.abs((frog.x + 25) - c.x) < 40) { c.active = false; collectCoin(c.type === 'exhaust' ? 5 : 1, c.x, c.lane*laneH+50); } } });
        frog.x += (frog.tX - frog.x) * 0.2; frog.y += (frog.tY - frog.y) * 0.2; 
        if(frog.jump > 0.1 && frog.jump * 0.85 <= 0.1 && map[frog.lane].type === 'water' && onLog) { spawnParticles(frog.x+25, frog.y+50, "#aaccff", 8, "splash"); Sound.playTone(600, 'sine', 0.05); }
        frog.jump *= 0.85; camY += (frog.y - height/2 - camY) * 0.05;
        if(map[frog.lane].type === 'water' && !onLog) { Sound.splash(); endGame(); }
    } else if(state === "menu") { camY += (frog.y - height/2 - camY) * 0.05; }
    particles.forEach((p, i) => { p.update(); if(p.life <= 0) particles.splice(i, 1); });
    floatingTexts.forEach((t, i) => { t.update(); if(t.life <= 0) floatingTexts.splice(i, 1); });
    draw(); requestAnimationFrame(loop);
}

function endGame() {
    if(state !== 'dead') Sound.crash(); state = "dead"; save(); spawnParticles(frog.x+25, frog.y+25, frog.color, 30, "splash"); shake = 5;
    setTimeout(() => { document.getElementById('ui-layer').style.display = "flex"; document.getElementById('msg-title').innerText = "MEGSEMMISÜLTÉL"; }, 500);
}

function draw() {
    ctx.clearRect(0,0,width,height); ctx.save(); 
    if(shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    ctx.translate(0, -camY);
    if(map.length > 0) {
        map.forEach((l, i) => {
            let y = i * laneH; if(!l || y+laneH < camY || y > camY+height) return;
            if(l.type === 'grass' || l.type === 'start') {
                let g = ctx.createLinearGradient(0, y, 0, y+laneH); g.addColorStop(0, "#112200"); g.addColorStop(1, "#224400"); ctx.fillStyle = g; ctx.fillRect(0, y, width, laneH);
                ctx.fillStyle = "#336600"; for(let j=0; j<width; j+=20) { ctx.fillRect(j + (l.seed*20), y + 10, 4, 10 + Math.sin(j)*5); }
            } else if(l.type === 'road') {
                ctx.fillStyle = "#111"; ctx.fillRect(0, y, width, laneH); ctx.fillStyle = "#333"; for(let j=0; j<width; j+=100) ctx.fillRect(j, y + laneH/2-5, 60, 10);
            } else if(l.type === 'water') {
                let g = ctx.createLinearGradient(0, y, 0, y+laneH); g.addColorStop(0, "#001133"); g.addColorStop(1, "#002266"); ctx.fillStyle = g; ctx.fillRect(0, y, width, laneH);
                ctx.fillStyle = "rgba(0, 242, 255, 0.1)"; for(let w=0; w<width; w+=30) ctx.fillRect(w + Math.sin(frame*0.02 + w)*20, y+10+Math.random()*80, 20, 5);
            } else if(l.type === 'goal') { 
                let g = ctx.createLinearGradient(0, y, 0, y+laneH); g.addColorStop(0, "#004422"); g.addColorStop(1, "#00ff66"); ctx.fillStyle = g; ctx.fillRect(0, y, width, laneH);
            } else if(l.type === 'rail') {
                ctx.fillStyle = "#221111"; ctx.fillRect(0, y, width, laneH); ctx.fillStyle = "#443322"; for(let j=0; j<width; j+=50) ctx.fillRect(j, y+5, 30, 90);
                ctx.fillStyle = "#777"; ctx.fillRect(0, y+20, width, 10); ctx.fillRect(0, y+70, width, 10);
                if(l.railState === 'warning' || l.railState === 'active') {
                    let lightOn = (frame % 15) < 8; ctx.fillStyle = lightOn ? "#ff0000" : "#550000"; ctx.shadowColor = lightOn ? "#ff0000" : "transparent"; ctx.shadowBlur = lightOn ? 40 : 0;
                    ctx.beginPath(); ctx.arc(60, y+50, 25, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(width-60, y+50, 25, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                }
            }
        });
        // AKADÁLYOK RAJZOLÁSA (KŐ ÉS FA)
        obstacles.forEach(o => { let y = o.lane * laneH + (laneH-60)/2; if(o.type==='tree') drawTree(o.x, y); else drawRock(o.x, y); });
        staticCoins.forEach(c => { let y = c.lane * laneH + (laneH-55)/2; if(c.active) { if(c.type === 'exhaust') drawExhaustPipe(c.x, y); else drawCoin(c.x, y); }});
        entities.forEach(e => { let y = e.lane*laneH + (laneH-55)/2; if(e.t === 'train') drawTrain(e, y); else if(e.t === 'c' || e.t === 'trabant') drawVehicle(e, y); else drawLog(e, y); });
        particles.forEach(p => p.draw(ctx));
        floatingTexts.forEach(t => t.draw(ctx));
    }
    drawFrog(frog.x, frog.y, frog.color, frog.jump);
    ctx.restore();
    if(weather === 'rain') { ctx.fillStyle = "rgba(0, 10, 30, 0.3)"; ctx.fillRect(0,0,width,height); }
    if(weather === 'snow') { ctx.fillStyle = "rgba(200, 220, 255, 0.2)"; ctx.fillRect(0,0,width,height); }
    let grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height); grad.addColorStop(0, "rgba(0,0,0,0)"); grad.addColorStop(1, "rgba(0,0,0,0.8)"); ctx.fillStyle = grad; ctx.fillRect(0,0,width,height);
}

function renderShop() {
    const grid = document.getElementById("skin-grid"); grid.innerHTML = '';
    skins.forEach(s => {
        const has = ownedSkins.includes(s.c); const active = currentSkin === s.c;
        const card = document.createElement('div'); card.className = `skin-card ${active ? 'active' : ''}`;
        const preview = document.createElement('div'); preview.className = 'skin-preview'; preview.style.background = s.c;
        if(s.c === '#ffd700') preview.style.boxShadow = "0 0 15px #ffd700"; if(s.c === '#b9f2ff') preview.style.boxShadow = "0 0 15px #b9f2ff";
        const name = document.createElement('div'); name.className = 'skin-name'; name.innerText = s.name;
        const price = document.createElement('div'); if(active) { price.className = 'skin-owned'; price.innerText = "AKTÍV"; } else if(has) { price.className = 'skin-owned'; price.innerText = "MEGVÉVE"; } else { price.className = 'skin-price'; price.innerText = s.p + " $"; }
        card.appendChild(preview); card.appendChild(name); card.appendChild(price);
        card.onclick = () => { Sound.coin(); if(has) { currentSkin = s.c; frog.color = s.c; } else if(totalCoins >= s.p) { totalCoins -= s.p; ownedSkins.push(s.c); currentSkin = s.c; frog.color = s.c; } save(); renderShop(); document.getElementById('coin-num').innerText = totalCoins; draw(); };
        grid.appendChild(card);
    });
}

function save() { localStorage.setItem('f_pro_lvl', level); localStorage.setItem('f_pro_coins', totalCoins); localStorage.setItem('f_pro_skins', JSON.stringify(ownedSkins)); localStorage.setItem('f_pro_curr', currentSkin); }

window.addEventListener('keydown', (e) => { if(state === "menu" && e.code === "Space") { Sound.init(); start(); } if(state !== "playing") return; const k = e.key.toLowerCase(); if(k === "arrowup" || k === "w") move('up'); if(k === "arrowdown" || k === "s") move('down'); if(k === "arrowleft" || k === "a") move('left'); if(k === "arrowright" || k === "d") move('right'); });
const setupBtn = (id, d) => { const el = document.getElementById(id); const trigger = (e) => { e.preventDefault(); move(d); }; el.onmousedown = trigger; el.ontouchstart = trigger; };
setupBtn('btn-up','up'); setupBtn('btn-down','down'); setupBtn('btn-left','left'); setupBtn('btn-right','right');

document.getElementById('start-btn').onclick = () => { Sound.init(); start(); };
