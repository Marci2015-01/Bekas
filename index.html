<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Végtelen Béka - Stabil Verzió</title>
<style>
    :root { --accent: #f1c40f; --bg: #1a1a1a; --glass: rgba(0,0,0,0.9); }
    html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        overflow: hidden; background: var(--bg);
        font-family: 'Segoe UI', Roboto, sans-serif;
        touch-action: none; user-select: none;
    }
    canvas { display: block; }
    
    #hud {
        position: absolute; top: 15px; left: 15px; right: 15px;
        display: flex; justify-content: space-between;
        background: var(--glass); color: white; padding: 12px 20px;
        border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
        z-index: 100; font-weight: bold; pointer-events: none;
    }

    #ui-layer {
        position: absolute; inset: 0;
        display: flex; justify-content: center; align-items: center;
        z-index: 200; pointer-events: none;
    }
    .panel {
        background: #15151a; color: white; padding: 30px;
        border-radius: 25px; text-align: center; border: 3px solid var(--accent);
        pointer-events: auto; width: 85%; max-width: 350px;
        box-shadow: 0 10px 50px rgba(0,0,0,1);
    }
    
    .big-btn {
        background: linear-gradient(135deg, #f39c12, #d35400);
        color: white; border: none; padding: 15px; margin: 10px 0;
        font-size: 18px; border-radius: 12px; cursor: pointer; width: 100%; 
        font-weight: bold; box-shadow: 0 5px 0 #a04000;
    }

    .skin-grid { 
        display: grid !important; grid-template-columns: repeat(3, 1fr) !important; 
        gap: 10px; margin: 20px 0; 
    }
    .skin-item { 
        background: #252525; padding: 10px; border-radius: 12px; 
        border: 2px solid transparent; cursor: pointer;
        display: flex; flex-direction: column; align-items: center;
    }
    .skin-item.active { border-color: var(--accent); background: #333; }
    .preview-box { width: 35px; height: 35px; border-radius: 8px; margin-bottom: 5px; }

    #controls {
        position: absolute; bottom: 20px; right: 20px;
        display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; z-index: 150;
    }
    .ctrl-btn {
        background: rgba(255,255,255,0.1); border-radius: 15px;
        color: white; height: 60px; display: flex; justify-content: center; align-items: center;
        font-size: 24px; backdrop-filter: blur(5px);
    }
</style>
</head>
<body>

<div id="hud">
    <div>SZINT: <span id="lvl-num">1</span></div>
    <div>PÉNZ: <span id="coin-num">0</span> 💰</div>
    <div>⏱ <span id="timer-num">0.0</span>s</div>
</div>

<div id="ui-layer">
    <div id="msg-box" class="panel">
        <h1 id="msg-title" style="color:var(--accent); margin:0">BÉKA KALAND</h1>
        <p id="msg-text">Laptopon használd a nyilakat!</p>
        <button class="big-btn" id="start-btn">JÁTÉK</button>
        <button class="big-btn" id="open-shop-btn" style="background:#3498db; box-shadow:0 5px 0 #2980b9;">BOLT</button>
    </div>

    <div id="shop-box" class="panel" style="display:none">
        <h1 style="color:var(--accent); margin:0">BÉKA BOLT</h1>
        <div class="skin-grid" id="skin-grid"></div>
        <button class="big-btn" id="close-shop-btn" style="background:#e74c3c; box-shadow:0 5px 0 #c0392b;">VISSZA</button>
    </div>
</div>

<div id="controls">
    <div class="ctrl-btn" id="btn-up" style="grid-column:2">▲</div>
    <div class="ctrl-btn" id="btn-left" style="grid-column:1; grid-row:2">◀</div>
    <div class="ctrl-btn" id="btn-down" style="grid-column:2; grid-row:2">▼</div>
    <div class="ctrl-btn" id="btn-right" style="grid-column:3; grid-row:2">▶</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// --- ADATOK ---
let level = parseInt(localStorage.getItem('f_lvl')) || 1;
let totalCoins = parseInt(localStorage.getItem('f_coins')) || 0;
let ownedSkins = JSON.parse(localStorage.getItem('f_skins')) || ['#2ecc71'];
let currentSkin = localStorage.getItem('f_curr') || '#2ecc71';

const skins = [
    { c: '#2ecc71', p: 0 }, { c: '#3498db', p: 20 }, { c: '#e74c3c', p: 40 },
    { c: '#f1c40f', p: 70 }, { c: '#9b59b6', p: 100 }, { c: '#ffffff', p: 150 }
];

let width, height, laneH = 80, state = "menu";
let map = [], entities = [], trains = [], coins = [];
let frog = { x:0, y:0, tX:0, tY:0, lane:0, scaleX:1, scaleY:1, color: currentSkin };
let camY = 0, frame = 0, startT = 0;

function save() {
    localStorage.setItem('f_lvl', level);
    localStorage.setItem('f_coins', totalCoins);
    localStorage.setItem('f_skins', JSON.stringify(ownedSkins));
    localStorage.setItem('f_curr', currentSkin);
}

// --- MOZGÁS ---
function move(d) {
    if(state !== "playing") return;
    frog.scaleX = 1.3; frog.scaleY = 0.7;
    setTimeout(() => { frog.scaleX = 1; frog.scaleY = 1; }, 150);

    if(d==='up' && frog.lane > 0) frog.lane--;
    else if(d==='down' && frog.lane < map.length-1) frog.lane++;
    else if(d==='left') { frog.tX -= 70; if(frog.tX < -40) { frog.tX += width; frog.x += width; } }
    else if(d==='right') { frog.tX += 70; if(frog.tX > width) { frog.tX -= width; frog.x -= width; } }
    
    frog.tY = frog.lane * laneH + (laneH-45)/2;
    if(frog.lane === 0) { 
        state = "menu"; level++; totalCoins += 10; save(); 
        document.getElementById('ui-layer').style.display = "flex"; 
        document.getElementById('msg-title').innerText = "SZINT KÉSZ!"; 
        document.getElementById('msg-text').innerText = "Szép volt! Jöhet a következő?";
    }
}

function start() {
    state = "playing";
    generateMap();
    frog.lane = map.length - 1;
    frog.tX = width/2 - 22; frog.tY = frog.lane * laneH + (laneH-45)/2;
    frog.x = frog.tX; frog.y = frog.tY;
    
    document.getElementById('coin-num').innerText = totalCoins;
    document.getElementById('lvl-num').innerText = level;
    document.getElementById('ui-layer').style.display = "none";
    startT = Date.now();
}

function generateMap() {
    map = [{type:'goal'}];
    let len = 15 + Math.min(level * 2, 40);
    for(let i=1; i<len-1; i++) {
        let r = Math.random();
        let type = r < 0.2 ? 'grass' : (r < 0.5 ? 'water' : (r < 0.6 && level > 1 ? 'train' : 'road'));
        map.push({type, d:Math.random()>0.5?1:-1, s:1.5 + level*0.05});
    }
    map.push({type:'start'});

    entities = []; trains = []; coins = [];
    map.forEach((l, i) => {
        if(l.type==='road' || l.type==='water') {
            for(let k=0; k<2; k++) entities.push({t:l.type==='road'?'c':'l', lane:i, x:Math.random()*width, w:l.type==='road'?100:180, s:l.s*l.d, col:['#e74c3c','#f1c40f','#3498db'][Math.floor(Math.random()*3)]});
        }
        if(l.type==='train') trains.push({lane:i, x:-3000, active:false, cd:120});
        if((l.type==='grass'||l.type==='road') && Math.random()<0.2) coins.push({lane:i, x:50+Math.random()*(width-100)});
    });
}

function endGame(reason) {
    if (state !== "playing") return; // Dupla hívás megakadályozása
    state = "dead";
    save();
    document.getElementById('ui-layer').style.display = "flex";
    document.getElementById('msg-box').style.display = "block";
    document.getElementById('shop-box').style.display = "none";
    document.getElementById('msg-title').innerText = "VÉGE!";
    document.getElementById('msg-text').innerText = reason + "\nPróbáld újra!";
}

// --- FŐ CIKLUS ---
function loop() {
    frame++;
    if(state === "playing") {
        document.getElementById('timer-num').innerText = ((Date.now()-startT)/1000).toFixed(1);
        
        let onLog = false;
        entities.forEach(e => {
            let prevX = e.x;
            e.x += e.s;
            if(e.s > 0 && e.x > width) e.x = -e.w;
            if(e.s < 0 && e.x < -e.w) e.x = width;

            if(e.t === 'l' && e.lane === frog.lane) {
                if(frog.x + 22 > e.x && frog.x + 22 < e.x + e.w) {
                    onLog = true;
                    frog.tX += e.s;
                    // Azonnali teleport rönkön
                    if(Math.abs(e.x - prevX) > 100) {
                        let diff = e.x - prevX;
                        frog.tX += diff; frog.x += diff;
                    }
                }
            }
            if(e.t === 'c' && e.lane === frog.lane && frog.x < e.x + e.w - 10 && frog.x + 45 > e.x + 10) endGame("Elütött egy autó!");
        });

        frog.x += (frog.tX - frog.x) * 0.3;
        frog.y += (frog.tY - frog.y) * 0.3;
        camY += (frog.y - height/2 - camY) * 0.1;
        camY = Math.max(0, Math.min(map.length * laneH - height, camY));

        trains.forEach(t => { if(!t.active){ t.cd--; if(t.cd<=0){ t.active=true; t.x=-3000; } } else { t.x+=75; if(t.x>width+2000){ t.active=false; t.cd=150; } if(frog.lane===t.lane && frog.x < t.x+2000 && frog.x+45 > t.x) endGame("Elütött a vonat!"); } });
        coins.forEach(c => { if(!c.u && frog.lane===c.lane && Math.abs(frog.x+22-c.x)<35){ c.u=true; totalCoins++; document.getElementById('coin-num').innerText=totalCoins; } });

        if(map[frog.lane].type === 'water' && !onLog) endGame("Beleestél a vízbe!");

        // Szabad teleport
        if(frog.tX < -100) { frog.tX += width + 100; frog.x += width + 100; }
        if(frog.tX > width + 100) { frog.tX -= width + 100; frog.x -= width + 100; }
    }
    draw();
    requestAnimationFrame(loop);
}

function draw() {
    ctx.clearRect(0,0,width,height);
    ctx.save();
    ctx.translate(0, -camY);
    
    map.forEach((l, i) => {
        let y = i * laneH;
        if (y+laneH < camY || y > camY+height) return;
        ctx.fillStyle = l.type==='grass'||l.type==='start' ? '#2ecc71' : l.type==='goal' ? '#f1c40f' : l.type==='road' ? '#34495e' : l.type==='water' ? '#2980b9' : '#1a1a1a';
        ctx.fillRect(0, y, width, laneH);
    });

    entities.forEach(e => {
        let y = e.lane*laneH + (laneH-45)/2;
        ctx.fillStyle = e.t==='c' ? e.col : "#6d4c41";
        ctx.beginPath(); ctx.roundRect(e.x, y, e.w, 45, 10); ctx.fill();
        if(e.t==='c') { // Kerekek és ablak
            ctx.fillStyle="rgba(255,255,255,0.3)"; ctx.fillRect(e.s>0?e.x+e.w-25:e.x+5, y+5, 20, 35);
        }
    });

    coins.forEach(c => { if(c.u) return; ctx.fillStyle="#f1c40f"; ctx.beginPath(); ctx.arc(c.x, c.lane*laneH+laneH/2, 12, 0, 7); ctx.fill(); });
    trains.forEach(t => { if(t.active){ ctx.fillStyle="#444"; ctx.fillRect(t.x, t.lane*laneH+15, 2000, 50); } });

    // BÉKA (Pupillákkal)
    ctx.save();
    ctx.translate(frog.x + 22.5, frog.y + 22.5);
    ctx.scale(frog.scaleX, frog.scaleY);
    ctx.fillStyle = frog.color;
    ctx.beginPath(); ctx.roundRect(-22.5, -22.5, 45, 45, 12); ctx.fill();
    ctx.fillStyle = "white"; 
    ctx.beginPath(); ctx.arc(-10, -10, 8, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(10, -10, 8, 0, 7); ctx.fill();
    ctx.fillStyle = "black"; 
    ctx.beginPath(); ctx.arc(-10, -10, 4, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(10, -10, 4, 0, 7); ctx.fill();
    ctx.restore();

    ctx.restore();
}

function renderShop() {
    const grid = document.getElementById("skin-grid");
    grid.innerHTML = '';
    skins.forEach(s => {
        const has = ownedSkins.includes(s.c);
        const active = currentSkin === s.c;
        const div = document.createElement('div');
        div.className = `skin-item ${active?'active':''}`;
        div.innerHTML = `<div class="preview-box" style="background:${s.c}"></div><div style="font-size:10px; font-weight:bold">${has ? 'OK' : s.p+'💰'}</div>`;
        div.onclick = (e) => {
            e.stopPropagation();
            if(has) { currentSkin = s.c; frog.color = s.c; }
            else if(totalCoins >= s.p) { totalCoins -= s.p; ownedSkins.push(s.c); currentSkin = s.c; frog.color = s.c; }
            save(); renderShop(); document.getElementById('coin-num').innerText = totalCoins;
        };
        grid.appendChild(div);
    });
}

// --- VEZÉRLÉS ---
window.addEventListener('keydown', (e) => {
    if(state === "menu" && e.code === "Space") start();
    if(state !== "playing") return;
    const k = e.key.toLowerCase();
    if(k === "arrowup" || k === "w") move('up');
    if(k === "arrowdown" || k === "s") move('down');
    if(k === "arrowleft" || k === "a") move('left');
    if(k === "arrowright" || k === "d") move('right');
});

const setupBtn = (id, d) => {
    const el = document.getElementById(id);
    const trigger = (e) => { e.preventDefault(); move(d); };
    el.onmousedown = trigger; el.ontouchstart = trigger;
};
setupBtn('btn-up','up'); setupBtn('btn-down','down'); setupBtn('btn-left','left'); setupBtn('btn-right','right');

document.getElementById('start-btn').onclick = start;
document.getElementById('open-shop-btn').onclick = () => { 
    document.getElementById('msg-box').style.display='none'; 
    document.getElementById('shop-box').style.display='block'; 
    renderShop(); 
};
document.getElementById('close-shop-btn').onclick = () => { 
    document.getElementById('msg-box').style.display='block'; 
    document.getElementById('shop-box').style.display='none'; 
};

window.onresize = () => { width=canvas.width=window.innerWidth; height=canvas.height=window.innerHeight; };
window.onresize(); loop();
renderShop();
</script>
</body>
</html>
