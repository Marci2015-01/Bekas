<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Szuper Útkelő - Kontrolleres</title>
<style>
    html, body {
        margin: 0; padding: 0; 
        height: 100%; width: 100%;
        overflow: hidden; 
        background-color: #222;
        font-family: sans-serif;
        touch-action: none;
        user-select: none;
    }
    canvas { display: block; background-color: #333; }
    
    /* UI elemek */
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        display: flex; justify-content: center; align-items: center;
        z-index: 50;
    }
    #msg-box {
        background: rgba(0,0,0,0.9); color: white; padding: 30px;
        border-radius: 15px; text-align: center; border: 4px solid white;
        pointer-events: auto; min-width: 280px;
    }
    button.big-btn {
        background: #27ae60; color: white; border: none; padding: 15px 40px; 
        font-size: 22px; border-radius: 10px; cursor: pointer; margin-top: 20px;
        font-weight: bold; width: 100%;
    }
    button.big-btn:active { background: #2ecc71; transform: scale(0.95); }

    /* Szint jelző bal felül */
    #hud {
        position: absolute; top: 10px; left: 10px;
        background: rgba(0,0,0,0.5); color: white;
        padding: 5px 15px; border-radius: 20px;
        font-weight: bold; font-size: 18px; pointer-events: none; z-index: 10;
        border: 1px solid rgba(255,255,255,0.3);
    }
    
    /* Gamepad állapot jelző */
    #gp-status {
        position: absolute; bottom: 10px; left: 10px;
        color: #0f0; font-weight: bold; font-size: 14px;
        background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px;
        display: none; z-index: 10;
    }

    /* IRÁNYÍTÓ GOMBOK */
    #controls {
        position: absolute; bottom: 20px; right: 20px;
        width: 200px; height: 140px; z-index: 100;
        display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr;
        gap: 10px;
    }
    .ctrl-btn {
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px; color: white; font-size: 24px;
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; pointer-events: auto; user-select: none;
    }
    .ctrl-btn:active, .active-key { background: rgba(255, 255, 255, 0.5); transform: scale(0.95); }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

</style>
</head>
<body>

<div id="hud">Szint: <span id="lvl-num">1</span></div>
<div id="gp-status">🎮 Kontroller Csatlakoztatva</div>

<div id="ui-layer">
    <div id="msg-box">
        <h1 id="msg-title">SZUPER ÚTKELŐ</h1>
        <p id="msg-text">Juss át a túloldalra!</p>
        <p style="font-size:12px; color:#ccc;">(Enter / Érintés / 🎮 A-gomb)</p>
        <button class="big-btn" id="start-btn">START</button>
    </div>
</div>

<div id="controls">
    <div class="ctrl-btn" id="btn-up">▲</div>
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-down">▼</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
</div>

<canvas id="game"></canvas>

<script>
// --- VÁLTOZÓK ---
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const uiLayer = document.getElementById("ui-layer");
const msgBox = document.getElementById("msg-box");
const msgTitle = document.getElementById("msg-title");
const msgText = document.getElementById("msg-text");
const startBtn = document.getElementById("start-btn");
const lvlNum = document.getElementById("lvl-num");
const gpStatus = document.getElementById("gp-status");

let width, height, laneH;
let lanes = 10;
let level = 1;
let state = "menu"; 
let gpTimer = 0; // Késleltetés a kontrollerhez, hogy ne legyen túl gyors

// Játék elemek
let frog = { x:0, y:0, lane:0, size:30 };
let cars = [];
let logs = [];
let train = { active:false, x:-1000, lane:4, speed:20, width:800 };
let trainLight = "green";

// --- MENTÉS ---
try {
    const saved = localStorage.getItem('frog_level_v2');
    if(saved) level = parseInt(saved);
} catch(e) {}
lvlNum.textContent = level;

// --- ÁTMÉRETEZÉS ---
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    laneH = height / lanes;
    if(state === "playing") updateFrogY();
}
window.addEventListener('resize', resize);
resize();

// --- INDÍTÁS ---
startBtn.addEventListener("click", startGame);
document.addEventListener("keydown", e => { if(e.key === "Enter" && state !== "playing") startGame(); });

function startGame() {
    state = "playing";
    uiLayer.style.display = "none";
    frog.lane = lanes - 1;
    frog.x = width/2 - frog.size/2;
    updateFrogY();
    generateLevel();
}

function generateLevel() {
    cars = []; logs = [];
    let speedMult = 1 + (level * 0.1);
    
    // Autók
    for(let i=5; i<=8; i++) {
        let count = 2 + Math.floor(Math.random() * 2);
        let dir = (i%2===0) ? 1 : -1;
        let speed = (3 + Math.random()) * speedMult * dir;
        for(let j=0; j<count; j++) cars.push({ x: Math.random()*width, lane: i, w: 60, h: 30, speed: speed });
    }
    // Deszkák
    for(let i=2; i<=3; i++) {
        let count = 3;
        let dir = (i%2===0) ? 1 : -1;
        let speed = (2 + Math.random()) * speedMult * dir;
        for(let j=0; j<count; j++) logs.push({ x: Math.random()*width, lane: i, w: 100+Math.random()*50, h: 25, speed: speed });
    }
    train.speed = 20 + level;
}

function updateFrogY() { frog.y = frog.lane * laneH + (laneH - frog.size)/2; }

function gameOver(win, reason) {
    state = "menu";
    uiLayer.style.display = "flex";
    if(win) {
        level++;
        try { localStorage.setItem('frog_level_v2', level); } catch(e){}
        lvlNum.textContent = level;
        msgTitle.textContent = "SZINT TELJESÍTVE!";
        msgTitle.style.color = "#2ecc71";
        msgText.textContent = "Gratulálok! Jöhet a " + level + ". szint?";
    } else {
        msgTitle.textContent = "VESZTETTÉL!";
        msgTitle.style.color = "#e74c3c";
        msgText.textContent = reason;
    }
    startBtn.textContent = "KÖVETKEZŐ KÖR";
}

// --- IRÁNYÍTÁS ---
function move(dir) {
    if(state !== "playing") return;
    if(dir === 'up') { frog.lane--; updateFrogY(); }
    else if(dir === 'down') { if(frog.lane < lanes-1) { frog.lane++; updateFrogY(); } }
    else if(dir === 'left') frog.x -= 40;
    else if(dir === 'right') frog.x += 40;
}

// Billentyűzet
document.addEventListener("keydown", e => {
    if(state !== "playing") return;
    if(e.key === "ArrowUp" || e.key === "w") { move('up'); highlight("btn-up"); }
    if(e.key === "ArrowDown" || e.key === "s") { move('down'); highlight("btn-down"); }
    if(e.key === "ArrowLeft" || e.key === "a") { move('left'); highlight("btn-left"); }
    if(e.key === "ArrowRight" || e.key === "d") { move('right'); highlight("btn-right"); }
});

// Érintés / Egér
function setupBtn(id, dir) {
    const btn = document.getElementById(id);
    btn.addEventListener("mousedown", (e) => { e.preventDefault(); move(dir); });
    btn.addEventListener("touchstart", (e) => {
        e.preventDefault(); move(dir);
        btn.classList.add("active-key");
        setTimeout(()=>btn.classList.remove("active-key"), 100);
    }, {passive: false});
}
setupBtn("btn-up", "up"); setupBtn("btn-down", "down");
setupBtn("btn-left", "left"); setupBtn("btn-right", "right");

function highlight(id) {
    const b = document.getElementById(id);
    b.classList.add("active-key");
    setTimeout(()=>b.classList.remove("active-key"), 100);
}

// --- KONTROLLER LOGIKA ---
function checkGamepad() {
    const gamepads = navigator.getGamepads();
    const gp = gamepads[0]; // Első kontroller

    if (!gp) {
        gpStatus.style.display = 'none';
        return;
    }
    gpStatus.style.display = 'block';

    if (gpTimer > 0) { gpTimer--; return; }

    // Start gomb (Általában a 9-es vagy a 0-ás gomb)
    if (state !== "playing") {
        if (gp.buttons[0].pressed || gp.buttons[9].pressed) {
            startGame();
            gpTimer = 30; // Hosszú szünet indításnál
        }
        return;
    }

    // Irányítás (D-Pad vagy Analog Stick)
    const deadzone = 0.5;

    // FEL (D-pad 12 vagy Stick Y < -0.5)
    if (gp.buttons[12].pressed || gp.axes[1] < -deadzone) {
        move('up'); highlight("btn-up"); gpTimer = 8; // Gyorsabb reakció
    }
    // LE
    else if (gp.buttons[13].pressed || gp.axes[1] > deadzone) {
        move('down'); highlight("btn-down"); gpTimer = 8;
    }
    // BAL
    else if (gp.buttons[14].pressed || gp.axes[0] < -deadzone) {
        move('left'); highlight("btn-left"); gpTimer = 8;
    }
    // JOBB
    else if (gp.buttons[15].pressed || gp.axes[0] > deadzone) {
        move('right'); highlight("btn-right"); gpTimer = 8;
    }
}

// --- FŐ CIKLUS ---
function loop() {
    // Kontroller ellenőrzése minden képkockán
    checkGamepad();

    if(state === "playing") {
        cars.forEach(c => {
            c.x += c.speed;
            if(c.speed > 0 && c.x > width) c.x = -c.w;
            if(c.speed < 0 && c.x < -c.w) c.x = width;
            if(frog.lane === c.lane && frog.x < c.x + c.w && frog.x + frog.size > c.x) gameOver(false, "Elütött az autó!");
        });

        let onLog = false; let logSpeed = 0;
        logs.forEach(l => {
            l.x += l.speed;
            if(l.speed > 0 && l.x > width) l.x = -l.w;
            if(l.speed < 0 && l.x < -l.w) l.x = width;
            if(frog.lane === l.lane && frog.x + frog.size/2 > l.x && frog.x + frog.size/2 < l.x + l.w) {
                onLog = true; logSpeed = l.speed;
            }
        });

        if(frog.lane === 2 || frog.lane === 3) {
            if(onLog) frog.x += logSpeed;
            else gameOver(false, "Beleestél a vízbe!");
        }

        if(!train.active) {
            if(Math.random() < 0.005 + (level*0.001)) { train.active = true; train.x = -train.width; trainLight = "red"; }
            else trainLight = "green";
        } else {
            train.x += train.speed;
            if(train.x > width + 500) { train.active = false; trainLight = "green"; }
            if(frog.lane === train.lane && frog.x < train.x + train.width && frog.x + frog.size > train.x) gameOver(false, "Elgázolt a vonat!");
        }
        
        if(frog.x < 0) frog.x = 0;
        if(frog.x > width - frog.size) frog.x = width - frog.size;
        if(frog.lane < 0) gameOver(true, "");
    }

    // RAJZOLÁS
    ctx.fillStyle = "#222"; ctx.fillRect(0, 0, width, height);

    for(let i=0; i<lanes; i++) {
        let y = i*laneH;
        if(i===2 || i===3) ctx.fillStyle = "#3498db"; 
        else if(i===4) ctx.fillStyle = "#34495e"; 
        else if(i===0 || i===lanes-1) ctx.fillStyle = "#7f8c8d"; 
        else ctx.fillStyle = "#555"; 
        ctx.fillRect(0, y, width, laneH);
        ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke();
    }

    let ty = 4*laneH + laneH/2;
    ctx.strokeStyle = "#95a5a6"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, ty-10); ctx.lineTo(width, ty-10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, ty+10); ctx.lineTo(width, ty+10); ctx.stroke();
    
    ctx.fillStyle = (trainLight==="red") ? "#c0392b" : "#440000"; ctx.beginPath(); ctx.arc(width-30, ty-25, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = (trainLight==="green") ? "#2ecc71" : "#004400"; ctx.beginPath(); ctx.arc(width-30, ty-8, 8, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = "#d35400"; logs.forEach(l => ctx.fillRect(l.x, l.lane*laneH + (laneH-l.h)/2, l.w, l.h));

    cars.forEach(c => {
        let cy = c.lane*laneH + (laneH-c.h)/2;
        ctx.fillStyle = "#e74c3c"; ctx.fillRect(c.x, cy, c.w, c.h);
        ctx.fillStyle = "#ecf0f1"; ctx.fillRect(c.x+5, cy+5, c.w-10, c.h/2);
    });

    if(train.active) {
        let tY = train.lane*laneH + (laneH-40)/2;
        ctx.fillStyle = "#8e44ad"; ctx.fillRect(train.x, tY, train.width, 40);
        ctx.fillStyle = "#f1c40f"; for(let k=20; k<train.width; k+=60) ctx.fillRect(train.x+k, tY+5, 40, 15);
    }

    if(state === "playing" || state === "menu") {
        ctx.fillStyle = "#2ecc71"; ctx.fillRect(frog.x, frog.y, frog.size, frog.size);
        ctx.fillStyle = "white"; ctx.fillRect(frog.x+5, frog.y+5, 8, 8); ctx.fillRect(frog.x+17, frog.y+5, 8, 8);
        ctx.fillStyle = "black"; ctx.fillRect(frog.x+7, frog.y+7, 4, 4); ctx.fillRect(frog.x+19, frog.y+7, 4, 4);
    }

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
